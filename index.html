<html lang="ro">

<meta charset="UTF-8">

<title>MovieShowRo</title>

<style>
/* ==============================
   RESET & BASE STYLES
============================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    background: #080808;
    color: white;
}

/* ==============================
   HEADER
============================== */
header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(17, 17, 17, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 2px solid #e50914;
    padding: 15px;
}

.header-content {
    max-width: 1400px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
}

.logo {
    color: #e50914;
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 0.5px;
}

#search {
    width: 100%;
    max-width: 500px;
    padding: 12px 18px;
    border: 1px solid #333;
    border-radius: 25px;
    outline: none;
    background: #222;
    color: white;
    font-size: 15px;
    transition: 0.2s;
}

#search:focus {
    border-color: #e50914;
    box-shadow: 0 0 10px rgba(229, 9, 20, 0.3);
}

nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

nav button {
    border: none;
    padding: 10px 16px;
    border-radius: 20px;
    background: #222;
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

nav button:hover,
nav button.active {
    background: #e50914;
}

/* ==============================
   HERO & MAIN
============================== */
.hero {
    text-align: center;
    padding: 55px 20px;
    background: linear-gradient(#1c1c1c, #080808);
}

.hero h1 {
    font-size: 45px;
    color: #e50914;
    margin-bottom: 10px;
}

.hero p {
    color: #aaa;
    font-size: 17px;
}

main {
    max-width: 1450px;
    margin: auto;
    padding: 30px 20px 50px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-left: 4px solid #e50914;
    padding-left: 12px;
}

.section-header h2 {
    font-size: 25px;
}

#count {
    color: #777;
    font-size: 13px;
}

/* ==============================
   GRID & CARDS
============================== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 20px;
}

.card {
    background: #141414;
    border: 1px solid #222;
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #444;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
}

.poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
    background: #222;
}

.info {
    padding: 12px;
}

.title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.category {
    color: #888;
    font-size: 12px;
    margin-bottom: 12px;
}

.watch {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 6px;
    background: #e50914;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.watch:hover {
    background: #f51a25;
}

#noResults {
    display: none;
    text-align: center;
    padding: 70px 20px;
    color: #888;
}

/* ==============================
   CINEMA MODE PLAYER OVERLAY
============================== */
#player {
    position: fixed;
    inset: 0;
    z-index: 5000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(10px);
}

#player.open {
    display: flex;
}

.player-box {
    position: relative;
    width: 100%;
    max-width: 1100px;
    background: #121318;
    border-radius: 16px;
    padding: 20px;
    max-height: 95vh;
    overflow-y: auto;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
}

#close {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: #252525;
    color: white;
    font-size: 18px;
    cursor: pointer;
    z-index: 10;
    transition: 0.2s;
}

#close:hover {
    background: #e50914;
    transform: scale(1.1);
}

#playerTitle {
    padding-right: 50px;
    margin-bottom: 15px;
    font-size: 22px;
    color: #fff;
}

.video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
}

.video-wrapper video, .video-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

.player-controls-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
    gap: 10px;
    flex-wrap: wrap;
}

.nav-ep-group {
    display: flex;
    gap: 8px;
}

.nav-ep-btn {
    background: #22242d;
    color: white;
    border: 1px solid #333645;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s;
}

.nav-ep-btn:hover:not(:disabled) {
    background: #333645;
    border-color: #4e5269;
}

.nav-ep-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.fs-button {
    background: linear-gradient(135deg, #e50914 0%, #b20710 100%);
    color: white;
    border: none;
    padding: 11px 20px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
}

.fs-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(229, 9, 20, 0.5);
}

.episodes-container {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #222;
}

.episodes-container h3 {
    font-size: 16px;
    margin-bottom: 12px;
    color: #ddd;
}

.episodes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
    gap: 10px;
}

.ep-btn {
    padding: 10px;
    background: #1c1d24;
    border: 1px solid #2a2b36;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: 0.2s;
}

.ep-btn:hover, .ep-btn.active {
    background: #e50914;
    border-color: #e50914;
    box-shadow: 0 2px 10px rgba(229, 9, 20, 0.4);
}

footer {
    text-align: center;
    padding: 35px 20px;
    border-top: 1px solid #222;
    color: #666;
}

@media (max-width: 700px) {
    .header-content { justify-content: center; }
    .logo { width: 100%; text-align: center; font-size: 23px; }
    #search { max-width: none; }
    nav { width: 100%; justify-content: center; }
    nav button { padding: 8px 10px; font-size: 11px; }
    .hero { padding: 40px 15px; }
    .hero h1 { font-size: 32px; }
    main { padding: 20px 10px 40px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .info { padding: 8px; }
    .title { font-size: 13px; }
    .category { font-size: 10px; }
    .watch { padding: 8px 4px; font-size: 11px; }
    #player { padding: 10px; }
    .player-box { padding: 15px; }
    .player-controls-bar { flex-direction: column; align-items: stretch; }
    .nav-ep-group { width: 100%; justify-content: space-between; }
    .nav-ep-btn { flex: 1; justify-content: center; }
    .fs-button { width: 100%; justify-content: center; }
}
</style>
</head>

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const count = document.getElementById("count");

const videoArea = document.getElementById("videoArea");

const close = document.getElementById("close");
const categoryButtons = document.querySelectorAll("nav button");

const epNavButtons = document.getElementById("epNavButtons");
const btnPrevEp = document.getElementById("btnPrevEp");
const btnNextEp = document.getElementById("btnNextEp");

let categoriaActuala = "toate";
let itemCurent = null;
let episodCurentIndex = 0;

function categorie(item) {
    if (item.id <= 50) return "filme";
    if (item.id <= 100) return "seriale";
    return "anime";
}

function numeCategorie(cat) {
    if (cat === "filme") return "🎬 Film";
    if (cat === "seriale") return "📺 Serial";
    return "🍥 Anime";
}

function afiseaza() {
    const text = search.value.toLowerCase().trim();
    grid.innerHTML = "";

    const rezultate = continut.filter(item => {
        const cat = categorie(item);
        const categorieOK = categoriaActuala === "toate" || cat === categoriaActuala;
        const cautareOK = item.nume.toLowerCase().includes(text);
        return categorieOK && cautareOK;
    });

    count.textContent = `${rezultate.length} titluri`;

    if (rezultate.length === 0) {
        noResults.style.display = "block";
    } else {
        noResults.style.display = "none";
        rezultate.forEach(item => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <img class="poster" src="${item.imagine}" alt="${item.nume}">
                <div class="info">
                    <div class="title" title="${item.nume}">${item.nume}</div>
                    <div class="category">${numeCategorie(categorie(item))}</div>
                    <button class="watch" onclick="deschidePlayer(${item.id})">Vezi Acum</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }
}

window.deschidePlayer = function(id) {
    itemCurent = continut.find(x => x.id === id);
    if (!itemCurent) return;

    playerTitle.textContent = itemCurent.nume;
    episodCurentIndex = 0;

    if (itemCurent.video !== undefined) {
        epNavButtons.style.display = "none";
        episodesArea.style.display = "none";
        incarcaVideo(itemCurent.video);
    } else {
        epNavButtons.style.display = "flex";
        episodesArea.style.display = "block";
        genereazaListaEpisoade();
        incarcaEpisod(0);
    }

    player.classList.add("open");
};

function incarcaVideo(url) {
    if (url) {
        videoArea.innerHTML = `<iframe src="${url}" allowfullscreen scrolling="no"></iframe>`;
    } else {
        videoArea.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;height:100%;color:#888;">Video indisponibil momentan.</div>`;
    }
}

function genereazaListaEpisoade() {
    episodesArea.innerHTML = "<h3>Episoade:</h3><div class='episodes-grid'></div>";
    const epGrid = episodesArea.querySelector(".episodes-grid");

    itemCurent.episoade.forEach((ep, index) => {
        const btn = document.createElement("button");
        btn.className = `ep-btn ${index === 0 ? 'active' : ''}`;
        btn.textContent = `Ep. ${ep.nr}`;
        btn.onclick = () => incarcaEpisod(index);
        epGrid.appendChild(btn);
    });
}

function incarcaEpisod(index) {
    episodCurentIndex = index;
    const ep = itemCurent.episoade[index];
    incarcaVideo(ep ? ep.url : "");

    const toateButoanele = episodesArea.querySelectorAll(".ep-btn");
    toateButoanele.forEach((b, i) => {
        b.classList.toggle("active", i === index);
    });

    btnPrevEp.disabled = index === 0;
    btnNextEp.disabled = index === itemCurent.episoade.length - 1;
}

window.schimbaEpisodRelativ = function(directie) {
    const noulIndex = episodCurentIndex + directie;
    if (itemCurent && itemCurent.episoade && noulIndex >= 0 && noulIndex < itemCurent.episoade.length) {
        incarcaEpisod(noulIndex);
    }
};

window.toggleFullScreen = function() {
    if (!document.fullscreenElement) {
        videoArea.requestFullscreen().catch(err => {
            alert(`Eroare la activarea ecranului complet: ${err.message}`);
        });
    } else {
        document.exitFullscreen();
    }
};

close.onclick = () => {
    player.classList.remove("open");
    videoArea.innerHTML = "";
};

search.oninput = afiseaza;

categoryButtons.forEach(btn => {
    btn.onclick = () => {
        categoryButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        categoriaActuala = btn.dataset.category;
        sectionTitle.textContent = btn.textContent.replace(/^[^\s]+\s*/, '');
        afiseaza();
    };
});

// Inițializare prima afișare
afiseaza();
</script>
</body>
</html>
