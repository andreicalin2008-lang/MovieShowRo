<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieShowRo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #080808;
            color: white;
        }

        /* =========================
           MENIU
        ========================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 15px 30px;

            background: #111;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            white-space: nowrap;
        }

        .menu {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .menu button {
            padding: 10px 15px;
            border: none;
            border-radius: 7px;

            background: transparent;
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        .menu button:hover {
            background: #e50914;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-container {
            width: 100%;
            max-width: 700px;

            margin: 25px auto 10px;
            padding: 0 20px;
        }

        .search-box {
            display: flex;
            align-items: center;

            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;

            padding: 5px 15px;

            transition: .2s;
        }

        .search-box:focus-within {
            border-color: #e50914;
            box-shadow: 0 0 15px rgba(229, 9, 20, .2);
        }

        .search-icon {
            font-size: 22px;
            margin-right: 10px;
        }

        #searchInput {
            width: 100%;

            padding: 12px 5px;

            border: none;
            outline: none;

            background: transparent;
            color: white;

            font-size: 16px;
        }

        #searchInput::placeholder {
            color: #888;
        }

        /* =========================
           PAGINI
        ========================= */

        .sectiune {
            display: none;

            min-height: calc(100vh - 70px);

            padding: 25px 20px 50px;
        }

        .sectiune.activa {
            display: block;
        }

        /* =========================
           ACASA
        ========================= */

        .hero {
            max-width: 1100px;
            min-height: 430px;

            margin: 30px auto;

            padding: 60px 40px;

            display: flex;
            align-items: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    rgba(0,0,0,.95),
                    rgba(0,0,0,.5)
                ),
                url("images/film1.jpg");

            background-size: cover;
            background-position: center;
        }

        .hero-content {
            max-width: 650px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #e50914;
        }

        .hero p {
            color: #ddd;
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .hero-button {
            padding: 13px 22px;

            border: none;
            border-radius: 7px;

            background: #e50914;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .hero-button:hover {
            background: #ff1f2d;
        }

        /* =========================
           TITLURI
        ========================= */

        .titlu {
            max-width: 1100px;

            margin: 10px auto 25px;

            font-size: 30px;

            border-left: 5px solid #e50914;

            padding-left: 12px;
        }

        /* =========================
           FILTRE CATEGORII
        ========================= */

        .filtre {
            max-width: 1100px;

            margin: 0 auto 25px;

            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filtru-btn {
            padding: 9px 15px;

            border: 1px solid #333;
            border-radius: 20px;

            background: #181818;
            color: white;

            cursor: pointer;
        }

        .filtru-btn:hover,
        .filtru-btn.activ {
            background: #e50914;
            border-color: #e50914;
        }

        /* =========================
           GRID
        ========================= */

        .filme-grid {
            width: 100%;
            max-width: 1200px;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 25px;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            width: 100%;

            padding: 12px;

            background: #181818;

            border-radius: 12px;

            text-align: center;

            transition:
                transform .2s,
                background .2s;

            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            background: #222;
        }

        .card img {
            width: 100%;
            height: 320px;

            object-fit: cover;

            border-radius: 8px;

            margin-bottom: 12px;
        }

        .card h3 {
            margin-bottom: 8px;

            min-height: 22px;
        }

        .card p {
            color: #aaa;
            margin-bottom: 15px;
        }

        .card button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 7px;

            background: #e50914;
            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .card button:hover {
            background: #ff1f2d;
        }

        /* =========================
           MESAJ
        ========================= */

        .mesaj {
            max-width: 600px;

            margin: 60px auto;

            padding: 60px 20px;

            text-align: center;

            background: #181818;

            border-radius: 15px;
        }

        .mesaj-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .mesaj p {
            color: #aaa;
            margin-top: 10px;
        }

        /* =========================
           CATEGORII
        ========================= */

        .categorii {
            max-width: 900px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap: 15px;
        }

        .categorii button {
            padding: 25px;

            border: 1px solid #333;
            border-radius: 10px;

            background: #181818;
            color: white;

            font-size: 17px;

            cursor: pointer;
        }

        .categorii button:hover {
            background: #e50914;
        }

        /* =========================
           REZULTATE SEARCH
        ========================= */

        .search-info {
            max-width: 1100px;

            margin: 10px auto 20px;

            color: #aaa;

            font-size: 15px;
        }

        .no-results {
            display: none;

            max-width: 600px;

            margin: 50px auto;

            padding: 40px 20px;

            text-align: center;

            background: #181818;

            border-radius: 15px;

            color: #aaa;
        }

        /* =========================
           PLAYER
        ========================= */

        #player {
            display: none;

            position: fixed;

            inset: 0;

            z-index: 9999;

            background:
                rgba(0,0,0,.97);

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .player-box {
            position: relative;

            width: 95%;

            max-width: 1100px;
        }

        #video {
            width: 100%;

            max-height: 85vh;

            display: block;

            background: black;

            border-radius: 10px;
        }

        /* =========================
           SUBTITRARE
        ========================= */

        video::cue {
            color: white;

            background:
                rgba(0,0,0,.75);

            font-size: 20px;
        }

        /* =========================
           BUTON INCHIDERE
        ========================= */

        .close {
            position: absolute;

            top: -55px;
            right: 0;

            width: 45px;
            height: 45px;

            border: none;
            border-radius: 50%;

            background: #e50914;

            color: white;

            font-size: 24px;

            cursor: pointer;

            z-index: 10000;
        }

        .close:hover {
            background: #ff1f2d;
        }

        /* =========================
           TELEFON
        ========================= */

        @media (max-width: 900px) {

            .header {
                flex-direction: column;
                gap: 12px;
            }

            .filme-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 550px) {

            .header {
                padding: 15px;
            }

            .logo {
                font-size: 22px;
            }

            .menu {
                width: 100%;
            }

            .menu button {
                padding: 8px 10px;
                font-size: 13px;
            }

            .hero {
                min-height: 500px;
                padding: 35px 20px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .filme-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .player-box {
                width: 98%;
            }

            .close {
                top: -50px;
            }

            .search-container {
                padding: 0 10px;
            }
        }
    </style>
</head>

        /* =========================
           CREARE CARD
        ========================= */

        function creeazaCard(item) {

            const card =
                document.createElement("div");

            card.className = "card";

            card.innerHTML = `

                <img
                    src="${item.imagine}"
                    alt="${item.nume}"
                    onerror="this.style.display='none'"
                >

                <h3>
                    ${item.nume}
                </h3>

                <p>
                    ${item.gen} • ${item.an}
                </p>

                <button
                    type="button"
                    onclick="openMovie('${item.video}')">

                    ▶ Vizionează

                </button>
            `;

            return card;
        }


        /* =========================
           AFIȘARE CONȚINUT
        ========================= */

        function afiseazaContinut() {

            const filmeGrid =
                document.getElementById(
                    "filmeGrid"
                );

            const deseneGrid =
                document.getElementById(
                    "deseneGrid"
                );

            const animeGrid =
                document.getElementById(
                    "animeGrid"
                );

            filmeGrid.innerHTML = "";
            deseneGrid.innerHTML = "";
            animeGrid.innerHTML = "";

            continut.forEach(function(item) {

                const card =
                    creeazaCard(item);

                if (item.tip === "film") {

                    filmeGrid.appendChild(card);

                }

                else if (item.tip === "desen") {

                    deseneGrid.appendChild(card);

                }

                else if (item.tip === "anime") {

                    animeGrid.appendChild(card);

                }

            });
        }


        /* =========================
           FILTRARE CATEGORII
        ========================= */

        function filtreaza(categorie) {

            const filmeGrid =
                document.getElementById(
                    "filmeGrid"
                );

            filmeGrid.innerHTML = "";

            const filme =
                continut.filter(function(item) {

                    if (item.tip !== "film") {
                        return false;
                    }

                    if (categorie === "toate") {
                        return true;
                    }

                    return item.categorie === categorie;
                });

            filme.forEach(function(item) {

                filmeGrid.appendChild(
                    creeazaCard(item)
                );

            });

            document
                .querySelectorAll(".filtru-btn")
                .forEach(function(btn) {

                    btn.classList.remove("activ");

                });

            event.target.classList.add("activ");
        }


        /* =========================
           CATEGORIE DIN PAGINA
        ========================= */

        function filtreazaSiDeschide(categorie) {

            showPage("filme");

            setTimeout(function() {

                filtreazaDirect(categorie);

            }, 100);

        }


        function filtreazaDirect(categorie) {

            const filmeGrid =
                document.getElementById(
                    "filmeGrid"
                );

            filmeGrid.innerHTML = "";

            const filme =
                continut.filter(function(item) {

                    return (
                        item.tip === "film" &&
                        item.categorie === categorie
                    );

                });

            filme.forEach(function(item) {

                filmeGrid.appendChild(
                    creeazaCard(item)
                );

            });
        }


        /* =========================
           SEARCH BAR
        ========================= */

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        searchInput.addEventListener(
            "input",
            function() {

                const text =
                    searchInput.value
                        .toLowerCase()
                        .trim();

                if (text === "") {

                    document
                        .getElementById("searchInfo")
                        .textContent = "";

                    document
                        .getElementById("noResults")
                        .style.display = "none";

                    return;
                }

                const rezultate =
                    continut.filter(function(item) {

                        return (
                            item.nume
                                .toLowerCase()
                                .includes(text)

                            ||

                            item.gen
                                .toLowerCase()
                                .includes(text)

                            ||

                            item.categorie
                                .toLowerCase()
                                .includes(text)
                        );

                    afiseazaRezultateCautare(
                        rezultate
                    );

            }
        );


        function afiseazaRezultateCautare(
            rezultate
        ) {

            showPage("filme");

            const grid =
                document.getElementById(
                    "filmeGrid"
                );

            const info =
                document.getElementById(
                    "searchInfo"
                );

            const noResults =
                document.getElementById(
                    "noResults"
                );

            grid.innerHTML = "";

            info.textContent =
                rezultate.length +
                " rezultat(e) găsit(e)";

            if (rezultate.length === 0) {

                noResults.style.display =
                    "block";

                return;
            }

            noResults.style.display =
                "none";

            rezultate.forEach(function(item) {

                grid.appendChild(
                    creeazaCard(item)
                );

            });
        }


        /* =========================
           PLAYER
        ========================= */

        function openMovie(videoLink) {

            const player =
                document.getElementById(
                    "player"
                );

            const video =
                document.getElementById(
                    "video"
                );

            if (!videoLink) {

                alert(
                    "Acest film nu are încă un link MixDrop."
                );

                return;
            }

            video.pause();

            video.innerHTML = "";

            /*
                MixDrop nu este fișier MP4 direct.
                Pentru linkurile MixDrop folosim iframe.
            */

            const iframe =
                document.createElement(
                    "iframe"
                );

            iframe.src =
                videoLink;

            iframe.width = "100%";
            iframe.height = "600";

            iframe.frameBorder = "0";

            iframe.allowFullscreen = true;

            iframe.allow =
                "autoplay; fullscreen";

            iframe.style.borderRadius =
                "10px";

            iframe.style.background =
                "black";

            video.style.display = "none";

            const playerBox =
                document.querySelector(
                    ".player-box"
                );

            playerBox.appendChild(
                iframe
            );

            player.style.display =
                "flex";
        }


        /* =========================
           ÎNCHIDE PLAYER
        ========================= */

        function closeMovie() {

            const player =
                document.getElementById(
                    "player"
                );

            const video =
                document.getElementById(
                    "video"
                );

            const iframe =
                document.querySelector(
                    ".player-box iframe"
                );

            if (iframe) {
                iframe.remove();
            }

            video.pause();

            video.style.display =
                "block";

            video.innerHTML = "";

            player.style.display =
                "none";
        }


        /* =========================
           ESC
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    closeMovie();

                }

            }
        );


        /* =========================
           PORNEȘTE SITE-UL
        ========================= */

        afiseazaContinut();

    </script>
