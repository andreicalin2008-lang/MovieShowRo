<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MovieShowRo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

/* =========================
   HEADER
========================= */

.header {
    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 15px 30px;

    background: #111;
    border-bottom: 1px solid #333;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    white-space: nowrap;
}

.menu {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
}

.menu button {
    padding: 10px 15px;
    border: none;
    border-radius: 7px;

    background: transparent;
    color: white;

    font-weight: bold;
    cursor: pointer;
}

.menu button:hover {
    background: #e50914;
}

/* =========================
   SEARCH
========================= */

.search-container {
    width: 100%;
    max-width: 700px;

    margin: 25px auto 10px;
    padding: 0 20px;
}

.search-box {
    display: flex;
    align-items: center;

    background: #181818;
    border: 1px solid #333;
    border-radius: 12px;

    padding: 5px 15px;
}

.search-box:focus-within {
    border-color: #e50914;
    box-shadow: 0 0 15px rgba(229,9,20,.2);
}

.search-icon {
    font-size: 22px;
    margin-right: 10px;
}

#searchInput {
    width: 100%;
    padding: 12px 5px;

    border: none;
    outline: none;

    background: transparent;
    color: white;

    font-size: 16px;
}

#searchInput::placeholder {
    color: #888;
}

/* =========================
   PAGINI
========================= */

.sectiune {
    display: none;
    min-height: calc(100vh - 70px);
    padding: 25px 20px 50px;
}

.sectiune.activa {
    display: block;
}

/* =========================
   HERO
========================= */

.hero {
    max-width: 1100px;
    min-height: 430px;

    margin: 30px auto;

    padding: 60px 40px;

    display: flex;
    align-items: center;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.95),
            rgba(0,0,0,.5)
        ),
        url("images/film1.jpg");

    background-size: cover;
    background-position: center;
}

.hero-content {
    max-width: 650px;
}

.hero h1 {
    font-size: 48px;
    margin-bottom: 20px;
}

.hero h1 span {
    color: #e50914;
}

.hero p {
    color: #ddd;
    font-size: 18px;
    line-height: 1.5;
    margin-bottom: 25px;
}

.hero-button {
    padding: 13px 22px;

    border: none;
    border-radius: 7px;

    background: #e50914;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.hero-button:hover {
    background: #ff1f2d;
}

/* =========================
   TITLURI
========================= */

.titlu {
    max-width: 1100px;

    margin: 10px auto 25px;

    font-size: 30px;

    border-left: 5px solid #e50914;
    padding-left: 12px;
}

/* =========================
   FILTRE
========================= */

.filtre {
    max-width: 1100px;

    margin: 0 auto 25px;

    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.filtru-btn {
    padding: 9px 15px;

    border: 1px solid #333;
    border-radius: 20px;

    background: #181818;
    color: white;

    cursor: pointer;
}

.filtru-btn:hover,
.filtru-btn.activ {
    background: #e50914;
    border-color: #e50914;
}

/* =========================
   GRID
========================= */

.filme-grid {
    width: 100%;
    max-width: 1200px;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 25px;
}

/* =========================
   CARD
========================= */

.card {
    width: 100%;

    padding: 12px;

    background: #181818;

    border-radius: 12px;

    text-align: center;

    transition: transform .2s, background .2s;

    overflow: hidden;
}

.card:hover {
    transform: translateY(-5px);
    background: #222;
}

.card img {
    width: 100%;
    height: 320px;

    object-fit: cover;

    border-radius: 8px;

    margin-bottom: 12px;
}

.card h3 {
    margin-bottom: 8px;
    min-height: 22px;
}

.card p {
    color: #aaa;
    margin-bottom: 15px;
}

.card button {
    width: 100%;

    padding: 12px;

    border: none;
    border-radius: 7px;

    background: #e50914;
    color: white;

    font-weight: bold;

    cursor: pointer;
}

.card button:hover {
    background: #ff1f2d;
}

/* =========================
   CATEGORII
========================= */

.categorii {
    max-width: 900px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

    gap: 15px;
}

.categorii button {
    padding: 25px;

    border: 1px solid #333;
    border-radius: 10px;

    background: #181818;
    color: white;

    font-size: 17px;

    cursor: pointer;
}

.categorii button:hover {
    background: #e50914;
}

/* =========================
   SEARCH INFO
========================= */

.search-info {
    max-width: 1100px;
    margin: 10px auto 20px;
    color: #aaa;
}

.no-results {
    display: none;

    max-width: 600px;

    margin: 50px auto;

    padding: 40px 20px;

    text-align: center;

    background: #181818;

    border-radius: 15px;

    color: #aaa;
}

/* =========================
   PLAYER
========================= */

#player {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 9999;

    background: rgba(0,0,0,.97);

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.player-box {
    position: relative;

    width: 95%;
    max-width: 1200px;

    background: #000;

    border-radius: 12px;

    overflow: visible;
}

#video {
    width: 100%;
    max-height: 80vh;
    display: none;

    background: #000;

    border-radius: 10px;
}

/* IFRAME */

.player-box iframe {
    width: 100%;
    height: 650px;

    display: block;

    border: 0;

    border-radius: 10px;

    background: #000;
}

/* =========================
   BUTOANE PLAYER
========================= */

.player-controls {
    position: absolute;

    bottom: -60px;
    left: 0;
    right: 0;

    display: flex;
    justify-content: center;

    gap: 10px;
}

.player-control-btn {
    border: none;

    padding: 11px 18px;

    border-radius: 8px;

    background: #e50914;
    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

.player-control-btn:hover {
    background: #ff1f2d;
}

/* =========================
   CLOSE
========================= */

.close {
    position: absolute;

    top: -55px;
    right: 0;

    width: 45px;
    height: 45px;

    border: none;
    border-radius: 50%;

    background: #e50914;

    color: white;

    font-size: 24px;

    cursor: pointer;

    z-index: 10000;
}

.close:hover {
    background: #ff1f2d;
}

/* =========================
   FULLSCREEN
========================= */

.player-box:fullscreen {
    width: 100vw;
    height: 100vh;

    max-width: none;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;
}

.player-box:fullscreen iframe {
    width: 100vw;
    height: 100vh;

    border-radius: 0;
}

.player-box:-webkit-full-screen {
    width: 100vw;
    height: 100vh;

    background: #000;
}

.player-box:-webkit-full-screen iframe {
    width: 100vw;
    height: 100vh;

    border-radius: 0;
}

/* =========================
   TELEFON
========================= */

@media (max-width: 900px) {

    .header {
        flex-direction: column;
        gap: 12px;
    }

    .filme-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .player-box iframe {
        height: 500px;
    }
}

@media (max-width: 550px) {

    .header {
        padding: 15px;
    }

    .logo {
        font-size: 22px;
    }

    .menu {
        width: 100%;
    }

    .menu button {
        padding: 8px 10px;
        font-size: 13px;
    }

    .hero {
        min-height: 500px;
        padding: 35px 20px;
    }

    .hero h1 {
        font-size: 32px;
    }

    .filme-grid {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .player-box {
        width: 98%;
    }

    .player-box iframe {
        height: 300px;
    }

    .close {
        top: -50px;
    }

    .search-container {
        padding: 0 10px;
    }

    .player-controls {
        bottom: -55px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo">
        🎬 MovieShowRo
    </div>

    <nav class="menu">

        <button type="button" onclick="showPage('acasa')">
            🏠 Acasă
        </button>

        <button type="button" onclick="showPage('filme')">
            🎬 Filme
        </button>

        <button type="button" onclick="showPage('desene')">
            🧸 Desene
        </button>

        <button type="button" onclick="showPage('anime')">
            🇯🇵 Anime
        </button>

        <button type="button" onclick="showPage('categorii')">
            📂 Categorii
        </button>

    </nav>

</header>

<!-- SEARCH -->

<div class="search-container">

    <div class="search-box">

        <span class="search-icon">🔎</span>

        <input
            type="text"
            id="searchInput"
            placeholder="Caută filme, desene sau anime..."
            autocomplete="off">

    </div>

</div>

<!-- =========================
     ACASA
========================= -->

<section id="acasa" class="sectiune activa">

    <div class="hero">

        <div class="hero-content">

            <h1>
                Bine ai venit pe
                <span>MovieShowRo</span> 🎬
            </h1>

            <p>
                Filme, desene și anime
                într-un singur loc.
            </p>

            <button
                type="button"
                class="hero-button"
                onclick="showPage('filme')">

                ▶ Vezi filmele

            </button>

        </div>

    </div>

</section>

<!-- =========================
     FILME
========================= -->

<section id="filme" class="sectiune">

    <h2 class="titlu">
        🎬 Filme
    </h2>

    <div class="filtre">

        <button class="filtru-btn activ"
            onclick="filtreaza('toate', this)">
            Toate
        </button>

        <button class="filtru-btn"
            onclick="filtreaza('Actiune', this)">
            💥 Acțiune
        </button>

        <button class="filtru-btn"
            onclick="filtreaza('Aventura', this)">
            🏔️ Aventură
        </button>

        <button class="filtru-btn"
            onclick="filtreaza('Comedie', this)">
            😂 Comedie
        </button>

        <button class="filtru-btn"
            onclick="filtreaza('Horror', this)">
            👻 Horror
        </button>

        <button class="filtru-btn"
            onclick="filtreaza('Romantic', this)">
            ❤️ Romantic
        </button>

        <button class="filtru-btn"
            onclick="filtreaza('SF', this)">
            🚀 SF
        </button>

        <button class="filtru-btn"
            onclick="filtreaza('Drama', this)">
            🎭 Dramă
        </button>

        <button class="filtru-btn"
            onclick="filtreaza('Crime', this)">
            🔫 Crime
        </button>

    </div>

    <div class="search-info" id="searchInfo"></div>

    <div class="filme-grid" id="filmeGrid"></div>

    <div class="no-results" id="noResults">

        🔎

        <h3>Nu am găsit nimic</h3>

        <p>Încearcă să cauți alt nume.</p>

    </div>

</section>

<!-- =========================
     DESENE
========================= -->

<section id="desene" class="sectiune">

    <h2 class="titlu">
        🧸 Desene
    </h2>

    <div class="filme-grid" id="deseneGrid"></div>

</section>

<!-- =========================
     ANIME
========================= -->

<section id="anime" class="sectiune">

    <h2 class="titlu">
        🇯🇵 Anime
    </h2>

    <div class="filme-grid" id="animeGrid"></div>

</section>

<!-- =========================
     CATEGORII
========================= -->

<section id="categorii" class="sectiune">

    <h2 class="titlu">
        📂 Categorii
    </h2>

    <div class="categorii">

        <button onclick="filtreazaSiDeschide('Actiune')">
            💥 Acțiune
        </button>

        <button onclick="filtreazaSiDeschide('Aventura')">
            🏔️ Aventură
        </button>

        <button onclick="filtreazaSiDeschide('Comedie')">
            😂 Comedie
        </button>

        <button onclick="filtreazaSiDeschide('Horror')">
            👻 Horror
        </button>

        <button onclick="filtreazaSiDeschide('Romantic')">
            ❤️ Romantic
        </button>

        <button onclick="filtreazaSiDeschide('SF')">
            🚀 SF
        </button>

        <button onclick="filtreazaSiDeschide('Drama')">
            🎭 Dramă
        </button>

        <button onclick="filtreazaSiDeschide('Crime')">
            🔫 Crime
        </button>

    </div>

</section>

<!-- =========================
     PLAYER
========================= -->

<div id="player">

    <div class="player-box" id="playerBox">

        <button
            type="button"
            class="close"
            onclick="closeMovie()">
            ✕
        </button>

        <video
            id="video"
            controls
            playsinline>
        </video>

        <div class="player-controls">

            <button
                type="button"
                class="player-control-btn"
                onclick="toggleFullscreen()">

                ⛶ Full Screen

            </button>

            <button
                type="button"
                class="player-control-btn"
                onclick="closeMovie()">

                ✕ Închide

            </button>

        </div>

    </div>

</div>

<script>

/* =========================
   LISTA CONȚINUT
========================= */

const continut = [

    /* =====================
       FILME
    ===================== */

    {
        id: 1,
        nume: "A Bronx Tale",
        tip: "film",
        categorie: "Drama",
        gen: "Drama, Crime",
        an: "1993",
        imagine: "images/film1.jpg",
        video: ""
    },

    {
        id: 2,
        nume: "Mai furios, mai iute",
        tip: "film",
        categorie: "Aventura",
        gen: "Aventură",
        an: "2026",
        imagine: "images/film2.jpg",
        video: ""
    }

];

/*
====================================================
ADAUGĂ AICI RESTUL FILMELOR TALE
====================================================

Exemplu:

{
    id: 3,
    nume: "Numele filmului",
    tip: "film",
    categorie: "Actiune",
    gen: "Acțiune",
    an: "2026",
    imagine: "images/film3.jpg",
    video: ""
},

====================================================
DESENE
====================================================
*/

for (let i = 1; i <= 50; i++) {

    continut.push({

        id: 1000 + i,

        nume: "Desen " + i,

        tip: "desen",

        categorie:
            i % 3 === 0
                ? "Actiune"
                : i % 2 === 0
                    ? "Aventura"
                    : "Comedie",

        gen: "Desene",

        an: "2026",

        imagine:
            "images/desen" + i + ".jpg",

        video: ""

    });

}

/*
====================================================
ANIME
====================================================
*/

for (let i = 1; i <= 50; i++) {

    continut.push({

        id: 2000 + i,

        nume: "Anime " + i,

        tip: "anime",

        categorie:
            i % 3 === 0
                ? "Comedie"
                : i % 2 === 0
                    ? "Aventura"
                    : "Actiune",

        gen: "Anime",

        an: "2026",

        imagine:
            "images/anime" + i + ".jpg",

        video: ""

    });

}

/* =========================
   SHOW PAGE
========================= */

function showPage(pageId) {

    document
        .querySelectorAll(".sectiune")
        .forEach(function(page) {

            page.classList.remove("activa");

        });

    const page =
        document.getElementById(pageId);

    if (page) {

        page.classList.add("activa");

    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

/* =========================
   CARD
========================= */

function creeazaCard(item) {

    const card =
        document.createElement("div");

    card.className = "card";

    const img =
        document.createElement("img");

    img.src = item.imagine;
    img.alt = item.nume;

    img.onerror = function() {
        this.style.display = "none";
    };

    const h3 =
        document.createElement("h3");

    h3.textContent = item.nume;

    const p =
        document.createElement("p");

    p.textContent =
        item.gen + " • " + item.an;

    const button =
        document.createElement("button");

    button.type = "button";

    button.textContent =
        "▶ Vizionează";

    button.onclick = function() {

        openMovie(item.video);

    };

    card.appendChild(img);
    card.appendChild(h3);
    card.appendChild(p);
    card.appendChild(button);

    return card;
}

/* =========================
   AFIȘARE
========================= */

function afiseazaContinut() {

    const filmeGrid =
        document.getElementById("filmeGrid");

    const deseneGrid =
        document.getElementById("deseneGrid");

    const animeGrid =
        document.getElementById("animeGrid");

    filmeGrid.innerHTML = "";
    deseneGrid.innerHTML = "";
    animeGrid.innerHTML = "";

    continut.forEach(function(item) {

        const card =
            creeazaCard(item);

        if (item.tip === "film") {

            filmeGrid.appendChild(card);

        }

        if (item.tip === "desen") {

            deseneGrid.appendChild(card);

        }

        if (item.tip === "anime") {

            animeGrid.appendChild(card);

        }

    });
}

/* =========================
   FILTRARE
========================= */

function filtreaza(categorie, buton) {

    const grid =
        document.getElementById("filmeGrid");

    grid.innerHTML = "";

    continut
        .filter(function(item) {

            if (item.tip !== "film") {
                return false;
            }

            if (categorie === "toate") {
                return true;
            }

            return item.categorie === categorie;

        })
        .forEach(function(item) {

            grid.appendChild(
                creeazaCard(item)
            );

        });

    document
        .querySelectorAll(".filtru-btn")
        .forEach(function(btn) {

            btn.classList.remove("activ");

        });

    if (buton) {
        buton.classList.add("activ");
    }
}

/* =========================
   CATEGORIE
========================= */

function filtreazaSiDeschide(categorie) {

    showPage("filme");

    const grid =
        document.getElementById("filmeGrid");

    grid.innerHTML = "";

    continut
        .filter(function(item) {

            return (
                item.tip === "film" &&
                item.categorie === categorie
            );

        })
        .forEach(function(item) {

            grid.appendChild(
                creeazaCard(item)
            );

        });
}

/* =========================
   SEARCH
========================= */

const searchInput =
    document.getElementById("searchInput");

searchInput.addEventListener(
    "input",
    function() {

        const text =
            searchInput.value
                .toLowerCase()
                .trim();

        if (text === "") {

            document
                .getElementById("searchInfo")
                .textContent = "";

            document
                .getElementById("noResults")
                .style.display = "none";

            afiseazaContinut();

            return;
        }

        const rezultate =
            continut.filter(function(item) {

                return (

                    item.nume
                        .toLowerCase()
                        .includes(text)

                    ||

                    item.gen
                        .toLowerCase()
                        .includes(text)

                    ||

                    item.categorie
                        .toLowerCase()
                        .includes(text)

                );

            });

        afiseazaRezultateCautare(rezultate);

    }
);

/* =========================
   REZULTATE
========================= */

function afiseazaRezultateCautare(rezultate) {

    showPage("filme");

    const grid =
        document.getElementById("filmeGrid");

    const info =
        document.getElementById("searchInfo");

    const noResults =
        document.getElementById("noResults");

    grid.innerHTML = "";

    info.textContent =
        rezultate.length +
        " rezultat(e) găsit(e)";

    if (rezultate.length === 0) {

        noResults.style.display = "block";

        return;
    }

    noResults.style.display = "none";

    rezultate.forEach(function(item) {

        grid.appendChild(
            creeazaCard(item)
        );

    });
}

/* =========================
   PLAYER
========================= */

function openMovie(videoLink) {

    if (!videoLink) {

        alert(
            "Acest videoclip nu are încă un link."
        );

        return;
    }

    const player =
        document.getElementById("player");

    const playerBox =
        document.getElementById("playerBox");

    const video =
        document.getElementById("video");

    /*
    Eliminăm iframe-ul vechi.
    */

    const oldIframe =
        playerBox.querySelector("iframe");

    if (oldIframe) {
        oldIframe.remove();
    }

    video.pause();
    video.style.display = "none";

    /*
    Pentru un player extern compatibil
    folosim iframe.
    */

    const iframe =
        document.createElement("iframe");

    iframe.src = videoLink;

    iframe.allowFullscreen = true;

    iframe.setAttribute(
        "allowfullscreen",
        ""
    );

    iframe.setAttribute(
        "allow",
        "autoplay; fullscreen; picture-in-picture"
    );

    playerBox.insertBefore(
        iframe,
        playerBox.querySelector(".player-controls")
    );

    player.style.display = "flex";
}

/* =========================
   FULLSCREEN
========================= */

function toggleFullscreen() {

    const playerBox =
        document.getElementById("playerBox");

    if (!document.fullscreenElement) {

        if (
            playerBox.requestFullscreen
        ) {

            playerBox.requestFullscreen();

        }

        else if (
            playerBox.webkitRequestFullscreen
        ) {

            playerBox.webkitRequestFullscreen();

        }

    } else {

        if (document.exitFullscreen) {

            document.exitFullscreen();

        }

    }
}

/* =========================
   CLOSE
========================= */

function closeMovie() {

    const player =
        document.getElementById("player");

    const playerBox =
        document.getElementById("playerBox");

    const video =
        document.getElementById("video");

    const iframe =
        playerBox.querySelector("iframe");

    if (iframe) {
        iframe.remove();
    }

    video.pause();

    if (document.fullscreenElement) {

        document.exitFullscreen()
            .catch(function() {});

    }

    player.style.display = "none";
}

========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeMovie();

        }

    }
);

afiseazaContinut();
