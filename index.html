```html
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MovieShowRo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
    min-height: 100vh;
}

/* =========================
   HEADER
========================= */

.header {
    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 15px 30px;

    background: #111;
    border-bottom: 1px solid #333;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    white-space: nowrap;
}

.menu {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
}

.menu button {
    border: none;
    border-radius: 7px;

    padding: 10px 15px;

    background: transparent;
    color: white;

    font-weight: bold;
    cursor: pointer;
}

.menu button:hover {
    background: #e50914;
}

/* =========================
   SEARCH
========================= */

.search-container {
    width: 100%;
    max-width: 700px;

    margin: 25px auto 10px;
    padding: 0 20px;
}

.search-box {
    display: flex;
    align-items: center;

    padding: 5px 15px;

    background: #181818;

    border: 1px solid #333;
    border-radius: 12px;
}

.search-box:focus-within {
    border-color: #e50914;
}

.search-icon {
    font-size: 22px;
    margin-right: 10px;
}

#searchInput {
    width: 100%;

    padding: 12px 5px;

    border: none;
    outline: none;

    background: transparent;
    color: white;

    font-size: 16px;
}

#searchInput::placeholder {
    color: #888;
}

/* =========================
   PAGINI
========================= */

.sectiune {
    display: none;
    min-height: calc(100vh - 70px);

    padding: 25px 20px 50px;
}

.sectiune.activa {
    display: block;
}

/* =========================
   ACASA
========================= */

.hero {
    max-width: 1100px;
    min-height: 430px;

    margin: 30px auto;

    padding: 60px 40px;

    display: flex;
    align-items: center;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.95),
            rgba(0,0,0,.45)
        ),
        url("images/film1.jpg");

    background-size: cover;
    background-position: center;
}

.hero-content {
    max-width: 650px;
}

.hero h1 {
    font-size: 48px;
    margin-bottom: 20px;
}

.hero h1 span {
    color: #e50914;
}

.hero p {
    color: #ddd;
    font-size: 18px;
    line-height: 1.5;
    margin-bottom: 25px;
}

.hero-button {
    padding: 13px 22px;

    border: none;
    border-radius: 7px;

    background: #e50914;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.hero-button:hover {
    background: #ff1f2d;
}

/* =========================
   TITLURI
========================= */

.titlu {
    max-width: 1100px;

    margin: 10px auto 25px;

    padding-left: 12px;

    font-size: 30px;

    border-left: 5px solid #e50914;
}

/* =========================
   FILTRE
========================= */

.filtre {
    max-width: 1100px;

    margin: 0 auto 25px;

    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.filtru-btn {
    padding: 9px 15px;

    border: 1px solid #333;
    border-radius: 20px;

    background: #181818;
    color: white;

    cursor: pointer;
}

.filtru-btn:hover,
.filtru-btn.activ {
    background: #e50914;
    border-color: #e50914;
}

/* =========================
   GRID
========================= */

.filme-grid {
    width: 100%;
    max-width: 1200px;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 25px;
}

/* =========================
   CARD
========================= */

.card {
    width: 100%;

    padding: 12px;

    background: #181818;

    border-radius: 12px;

    text-align: center;

    overflow: hidden;

    transition: .2s;
}

.card:hover {
    transform: translateY(-5px);
    background: #222;
}

.card img {
    width: 100%;
    height: 320px;

    object-fit: cover;

    border-radius: 8px;

    margin-bottom: 12px;
}

.card h3 {
    margin-bottom: 8px;
    min-height: 22px;
}

.card p {
    color: #aaa;
    margin-bottom: 15px;
}

.card button {
    width: 100%;

    padding: 12px;

    border: none;
    border-radius: 7px;

    background: #e50914;
    color: white;

    font-weight: bold;

    cursor: pointer;
}

.card button:hover {
    background: #ff1f2d;
}

/* =========================
   CATEGORII
========================= */

.categorii {
    max-width: 900px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

    gap: 15px;
}

.categorii button {
    padding: 25px;

    border: 1px solid #333;
    border-radius: 10px;

    background: #181818;
    color: white;

    font-size: 17px;

    cursor: pointer;
}

.categorii button:hover {
    background: #e50914;
}

/* =========================
   SEARCH INFO
========================= */

.search-info {
    max-width: 1100px;

    margin: 10px auto 20px;

    color: #aaa;
}

.no-results {
    display: none;

    max-width: 600px;

    margin: 50px auto;

    padding: 40px 20px;

    text-align: center;

    background: #181818;

    border-radius: 15px;

    color: #aaa;
}

/* =========================
   PLAYER
========================= */

#player {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 9999;

    background: rgba(0,0,0,.97);

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.player-box {
    position: relative;

    width: 95%;
    max-width: 1200px;
}

#movieFrame {
    width: 100%;
    height: 70vh;

    display: block;

    border: none;
    border-radius: 10px;

    background: black;
}

/* =========================
   PLAYER BUTOANE
========================= */

.player-buttons {
    position: absolute;

    top: -55px;
    right: 0;

    display: flex;
    gap: 10px;
}

.player-buttons button {
    width: 45px;
    height: 45px;

    border: none;
    border-radius: 50%;

    background: #e50914;
    color: white;

    font-size: 20px;

    cursor: pointer;
}

.player-buttons button:hover {
    background: #ff1f2d;
}

/* =========================
   MESAJ
========================= */

.mesaj {
    max-width: 600px;

    margin: 60px auto;

    padding: 60px 20px;

    text-align: center;

    background: #181818;

    border-radius: 15px;
}

.mesaj-icon {
    font-size: 60px;
    margin-bottom: 15px;
}

.mesaj p {
    color: #aaa;
    margin-top: 10px;
}

/* =========================
   TELEFON
========================= */

@media (max-width: 900px) {

    .header {
        flex-direction: column;
        gap: 12px;
    }

    .filme-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 550px) {

    .header {
        padding: 15px;
    }

    .logo {
        font-size: 22px;
    }

    .menu {
        width: 100%;
    }

    .menu button {
        padding: 8px 10px;
        font-size: 13px;
    }

    .hero {
        min-height: 500px;
        padding: 35px 20px;
    }

    .hero h1 {
        font-size: 32px;
    }

    .filme-grid {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    #movieFrame {
        height: 55vh;
    }

    .player-box {
        width: 98%;
    }

    .player-buttons {
        top: -50px;
    }

    .search-container {
        padding: 0 10px;
    }
}
</style>
</head>

<body>

<!-- =========================
     MENIU
========================= -->

<header class="header">

    <div class="logo">
        🎬 MovieShowRo
    </div>

    <nav class="menu">

        <button onclick="showPage('acasa')">
            🏠 Acasă
        </button>

        <button onclick="showPage('filme')">
            🎬 Filme
        </button>

        <button onclick="showPage('desene')">
            🧸 Desene
        </button>

        <button onclick="showPage('anime')">
            🇯🇵 Anime
        </button>

        <button onclick="showPage('categorii')">
            📂 Categorii
        </button>

    </nav>

</header>


<!-- =========================
     SEARCH
========================= -->

<div class="search-container">

    <div class="search-box">

        <span class="search-icon">🔎</span>

        <input
            type="text"
            id="searchInput"
            placeholder="Caută filme, desene sau anime..."
            autocomplete="off">

    </div>

</div>


<!-- =========================
     ACASA
========================= -->

<section id="acasa" class="sectiune activa">

    <div class="hero">

        <div class="hero-content">

            <h1>
                Bine ai venit pe
                <span>MovieShowRo</span> 🎬
            </h1>

            <p>
                Filme, desene și anime
                într-un singur loc.
            </p>

            <button
                class="hero-button"
                onclick="showPage('filme')">

                ▶ Vezi filmele

            </button>

        </div>

    </div>

</section>


<!-- =========================
     FILME
========================= -->

<section id="filme" class="sectiune">

    <h2 class="titlu">
        🎬 Filme
    </h2>

    <div class="filtre">

        <button class="filtru-btn activ"
                onclick="filtreaza('toate', this)">
            Toate
        </button>

        <button class="filtru-btn"
                onclick="filtreaza('Actiune', this)">
            💥 Acțiune
        </button>

        <button class="filtru-btn"
                onclick="filtreaza('Aventura', this)">
            🏔️ Aventură
        </button>

        <button class="filtru-btn"
                onclick="filtreaza('Comedie', this)">
            😂 Comedie
        </button>

        <button class="filtru-btn"
                onclick="filtreaza('Horror', this)">
            👻 Horror
        </button>

        <button class="filtru-btn"
                onclick="filtreaza('Romantic', this)">
            ❤️ Romantic
        </button>

        <button class="filtru-btn"
                onclick="filtreaza('SF', this)">
            🚀 SF
        </button>

        <button class="filtru-btn"
                onclick="filtreaza('Drama', this)">
            🎭 Dramă
        </button>

        <button class="filtru-btn"
                onclick="filtreaza('Crime', this)">
            🔫 Crime
        </button>

    </div>

    <div class="search-info" id="searchInfo"></div>

    <div class="filme-grid" id="filmeGrid"></div>

    <div class="no-results" id="noResults">

        <div class="mesaj-icon">🔎</div>

        <h3>Nu am găsit nimic</h3>

        <p>Încearcă să cauți alt nume.</p>

    </div>

</section>


<!-- =========================
     DESENE
========================= -->

<section id="desene" class="sectiune">

    <h2 class="titlu">
        🧸 Desene
    </h2>

    <div
        class="filme-grid"
        id="deseneGrid">
    </div>

</section>


<!-- =========================
     ANIME
========================= -->

<section id="anime" class="sectiune">

    <h2 class="titlu">
        🇯🇵 Anime
    </h2>

    <div
        class="filme-grid"
        id="animeGrid">
    </div>

</section>


<!-- =========================
     CATEGORII
========================= -->

<section id="categorii" class="sectiune">

    <h2 class="titlu">
        📂 Categorii
    </h2>

    <div class="categorii">

        <button onclick="filtreazaSiDeschide('Actiune')">
            💥 Acțiune
        </button>

        <button onclick="filtreazaSiDeschide('Aventura')">
            🏔️ Aventură
        </button>

        <button onclick="filtreazaSiDeschide('Comedie')">
            😂 Comedie
        </button>

        <button onclick="filtreazaSiDeschide('Horror')">
            👻 Horror
        </button>

        <button onclick="filtreazaSiDeschide('Romantic')">
            ❤️ Romantic
        </button>

        <button onclick="filtreazaSiDeschide('SF')">
            🚀 SF
        </button>

        <button onclick="filtreazaSiDeschide('Drama')">
            🎭 Dramă
        </button>

        <button onclick="filtreazaSiDeschide('Crime')">
            🔫 Crime
        </button>

    </div>

</section>


<!-- =========================
     PLAYER
========================= -->

<div id="player">

    <div class="player-box">

        <div class="player-buttons">

            <button
                onclick="fullScreenMovie()"
                title="Full screen">
                ⛶
            </button>

            <button
                onclick="closeMovie()"
                title="Închide">
                ✕
            </button>

        </div>

        <iframe
            id="movieFrame"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>

    </div>

</div>


<script>

/* =====================================================
   LISTA DE CONȚINUT
===================================================== */

const continut = [];


/* =====================================================
   🎬 FILME 1 - 50
===================================================== */

const categoriiFilme = [
    "Actiune",
    "Aventura",
    "Comedie",
    "Horror",
    "Romantic",
    "SF",
    "Drama",
    "Crime"
];

for (let i = 1; i <= 50; i++) {

    continut.push({

        id: i,

        nume: "Film " + i,

        tip: "film",

        categorie:
            categoriiFilme[(i - 1) % categoriiFilme.length],

        gen:
            categoriiFilme[(i - 1) % categoriiFilme.length],

        an: "2026",

        imagine:
            "images/film" + i + ".jpg",

        video: ""

    });

}


/* =====================================================
   🧸 DESENE 1 - 50
===================================================== */

const categoriiDesene = [
    "Comedie",
    "Aventura",
    "Actiune",
    "Drama"
];

for (let i = 1; i <= 50; i++) {

    continut.push({

        id: i,

        nume: "Desen " + i,

        tip: "desen",

        categorie:
            categoriiDesene[(i - 1) % categoriiDesene.length],

        gen:
            categoriiDesene[(i - 1) % categoriiDesene.length],

        an: "2026",

        imagine:
            "images/desen" + i + ".jpg",

        video: ""

    });

}


/* =====================================================
   🇯🇵 ANIME 1 - 50
===================================================== */

const categoriiAnime = [
    "Actiune",
    "Aventura",
    "SF",
    "Drama"
];

for (let i = 1; i <= 50; i++) {

    continut.push({

        id: i,

        nume: "Anime " + i,

        tip: "anime",

        categorie:
            categoriiAnime[(i - 1) % categoriiAnime.length],

        gen:
            categoriiAnime[(i - 1) % categoriiAnime.length],

        an: "2026",

        imagine:
            "images/anime" + i + ".jpg",

        video: ""

    });

}


/* =====================================================
   SCHIMBA PAGINA
===================================================== */

function showPage(pageId) {

    document
        .querySelectorAll(".sectiune")
        .forEach(function(page) {

            page.classList.remove("activa");

        });

    const page =
        document.getElementById(pageId);

    if (page) {

        page.classList.add("activa");

    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   CREARE CARD
===================================================== */

function creeazaCard(item) {

    const card =
        document.createElement("div");

    card.className = "card";

    const img =
        document.createElement("img");

    img.src = item.imagine;

    img.alt = item.nume;

    img.onerror = function() {

        this.style.display = "none";

    };


    const title =
        document.createElement("h3");

    title.textContent =
        item.nume;


    const info =
        document.createElement("p");

    info.textContent =
        item.gen + " • " + item.an;


    const button =
        document.createElement("button");

    button.type = "button";

    button.textContent =
        "▶ Vizionează";

    button.onclick = function() {

        openMovie(item.video);

    };


    card.appendChild(img);

    card.appendChild(title);

    card.appendChild(info);

    card.appendChild(button);


    return card;

}


/* =====================================================
   AFIȘARE FILME
===================================================== */

function afiseazaFilme(lista) {

    const grid =
        document.getElementById("filmeGrid");

    grid.innerHTML = "";

    lista.forEach(function(item) {

        grid.appendChild(
            creeazaCard(item)
        );

    });

}


/* =====================================================
   AFIȘARE DESENE
===================================================== */

function afiseazaDesene() {

    const grid =
        document.getElementById("deseneGrid");

    grid.innerHTML = "";

    const desene =
        continut.filter(function(item) {

            return item.tip === "desen";

        });

    desene.forEach(function(item) {

        grid.appendChild(
            creeazaCard(item)
        );

    });

}


/* =====================================================
   AFIȘARE ANIME
===================================================== */

function afiseazaAnime() {

    const grid =
        document.getElementById("animeGrid");

    grid.innerHTML = "";

    const anime =
        continut.filter(function(item) {

            return item.tip === "anime";

        });

    anime.forEach(function(item) {

        grid.appendChild(
            creeazaCard(item)
        );

    });

}


/* =====================================================
   FILTRARE
===================================================== */

function filtreaza(categorie, buton) {

    showPage("filme");

    const filme =
        continut.filter(function(item) {

            if (item.tip !== "film") {
                return false;
            }

            if (categorie === "toate") {
                return true;
            }

            return item.categorie === categorie;

        });


    afiseazaFilme(filme);


    document
        .querySelectorAll(".filtru-btn")
        .forEach(function(btn) {

            btn.classList.remove("activ");

        });


    if (buton) {

        buton.classList.add("activ");

    }


    document
        .getElementById("searchInfo")
        .textContent = "";

}


/* =====================================================
   CATEGORIE
===================================================== */

function filtreazaSiDeschide(categorie) {

    showPage("filme");

    const filme =
        continut.filter(function(item) {

            return (
                item.tip === "film" &&
                item.categorie === categorie
            );

        });

    afiseazaFilme(filme);

    document
        .getElementById("searchInfo")
        .textContent =
        filme.length +
        " film(e) din categoria " +
        categorie;

}


/* =====================================================
   SEARCH
===================================================== */

const searchInput =
    document.getElementById("searchInput");


searchInput.addEventListener(
    "input",
    function() {

        const text =
            this.value
                .toLowerCase()
                .trim();


        const info =
            document.getElementById(
                "searchInfo"
            );

        const noResults =
            document.getElementById(
                "noResults"
            );


        if (text === "") {

            info.textContent = "";

            noResults.style.display =
                "none";

            afiseazaFilme(
                continut.filter(function(item) {

                    return item.tip === "film";

                })
            );

            return;

        }


        const rezultate =
            continut.filter(function(item) {

                return (

                    item.nume
                        .toLowerCase()
                        .includes(text)

                    ||

                    item.gen
                        .toLowerCase()
                        .includes(text)

                    ||

                    item.categorie
                        .toLowerCase()
                        .includes(text)

                    ||

                    item.tip
                        .toLowerCase()
                        .includes(text)

                );

            });


        showPage("filme");


        afiseazaFilme(rezultate);


        info.textContent =
            rezultate.length +
            " rezultat(e) găsit(e)";


        if (rezultate.length === 0) {

            noResults.style.display =
                "block";

        } else {

            noResults.style.display =
                "none";

        }

    }
);


/* =====================================================
   PLAYER
===================================================== */

function openMovie(videoLink) {

    if (!videoLink) {

        alert(
            "Acest titlu nu are încă o sursă video adăugată."
        );

        return;

    }


    const player =
        document.getElementById("player");

    const frame =
        document.getElementById("movieFrame");


    frame.src = videoLink;


    player.style.display =
        "flex";

    document.body.style.overflow =
        "hidden";

}


/* =====================================================
   FULL SCREEN
===================================================== */

function fullScreenMovie() {

    const frame =
        document.getElementById("movieFrame");


    if (frame.requestFullscreen) {

        frame.requestFullscreen();

    }

    else if (frame.webkitRequestFullscreen) {

        frame.webkitRequestFullscreen();

    }

}


/* =====================================================
   ÎNCHIDE PLAYER
===================================================== */

function closeMovie() {

    const player =
        document.getElementById("player");

    const frame =
        document.getElementById("movieFrame");


    frame.src = "";


    player.style.display =
        "none";

    document.body.style.overflow =
        "auto";

}


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeMovie();

        }

    }
);


/* =====================================================
   PORNIRE SITE
===================================================== */

afiseazaFilme(
    continut.filter(function(item) {

        return item.tip === "film";

    })
);

afiseazaDesene();

afiseazaAnime();

</script>

</body>
</html>
