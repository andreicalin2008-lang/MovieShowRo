<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieShowRo</title>

<!-- Font Awesome pentru pictograme -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ==============================
   RESET & BASE STYLES
============================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    background: #080808;
    color: white;
}

/* ==============================
   HEADER
============================== */
header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(17, 17, 17, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 2px solid #e50914;
    padding: 15px;
}

.header-content {
    max-width: 1400px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
}

.logo {
    color: #e50914;
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 0.5px;
}

#search {
    width: 100%;
    max-width: 500px;
    padding: 12px 18px;
    border: 1px solid #333;
    border-radius: 25px;
    outline: none;
    background: #222;
    color: white;
    font-size: 15px;
    transition: 0.2s;
}

#search:focus {
    border-color: #e50914;
    box-shadow: 0 0 10px rgba(229, 9, 20, 0.3);
}

nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

nav button {
    border: none;
    padding: 10px 16px;
    border-radius: 20px;
    background: #222;
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

nav button:hover,
nav button.active {
    background: #e50914;
}

/* ==============================
   HERO & MAIN
============================== */
.hero {
    text-align: center;
    padding: 55px 20px;
    background: linear-gradient(#1c1c1c, #080808);
}

.hero h1 {
    font-size: 45px;
    color: #e50914;
    margin-bottom: 10px;
}

.hero p {
    color: #aaa;
    font-size: 17px;
}

main {
    max-width: 1450px;
    margin: auto;
    padding: 30px 20px 50px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-left: 4px solid #e50914;
    padding-left: 12px;
}

.section-header h2 {
    font-size: 25px;
}

#count {
    color: #777;
    font-size: 13px;
}

/* ==============================
   GRID & CARDS
============================== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 20px;
}

.card {
    background: #141414;
    border: 1px solid #222;
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #444;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
}

.poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
    background: #222;
}

.info {
    padding: 12px;
}

.title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.category {
    color: #888;
    font-size: 12px;
    margin-bottom: 12px;
}

.watch {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 6px;
    background: #e50914;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.watch:hover {
    background: #f51a25;
}

#noResults {
    display: none;
    text-align: center;
    padding: 70px 20px;
    color: #888;
}

/* ==============================
   CINEMA MODE PLAYER OVERLAY
============================== */
#player {
    position: fixed;
    inset: 0;
    z-index: 5000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(10px);
}

#player.open {
    display: flex;
}

.player-box {
    position: relative;
    width: 100%;
    max-width: 1100px;
    background: #121318;
    border-radius: 16px;
    padding: 20px;
    max-height: 95vh;
    overflow-y: auto;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
}

#close {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: #252525;
    color: white;
    font-size: 18px;
    cursor: pointer;
    z-index: 10;
    transition: 0.2s;
}

#close:hover {
    background: #e50914;
    transform: scale(1.1);
}

#playerTitle {
    padding-right: 50px;
    margin-bottom: 15px;
    font-size: 22px;
    color: #fff;
}

.video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
}

.video-wrapper video, .video-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

.player-controls-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
    gap: 10px;
    flex-wrap: wrap;
}

.nav-ep-group {
    display: flex;
    gap: 8px;
}

.nav-ep-btn {
    background: #22242d;
    color: white;
    border: 1px solid #333645;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s;
}

.nav-ep-btn:hover:not(:disabled) {
    background: #333645;
    border-color: #4e5269;
}

.nav-ep-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.fs-button {
    background: linear-gradient(135deg, #e50914 0%, #b20710 100%);
    color: white;
    border: none;
    padding: 11px 20px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
}

.fs-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(229, 9, 20, 0.5);
}

.episodes-container {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #222;
}

.episodes-container h3 {
    font-size: 16px;
    margin-bottom: 12px;
    color: #ddd;
}

.episodes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
    gap: 10px;
}

.ep-btn {
    padding: 10px;
    background: #1c1d24;
    border: 1px solid #2a2b36;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: 0.2s;
}

.ep-btn:hover, .ep-btn.active {
    background: #e50914;
    border-color: #e50914;
    box-shadow: 0 2px 10px rgba(229, 9, 20, 0.4);
}

footer {
    text-align: center;
    padding: 35px 20px;
    border-top: 1px solid #222;
    color: #666;
}

@media (max-width: 700px) {
    .header-content { justify-content: center; }
    .logo { width: 100%; text-align: center; font-size: 23px; }
    #search { max-width: none; }
    nav { width: 100%; justify-content: center; }
    nav button { padding: 8px 10px; font-size: 11px; }
    .hero { padding: 40px 15px; }
    .hero h1 { font-size: 32px; }
    main { padding: 20px 10px 40px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .info { padding: 8px; }
    .title { font-size: 13px; }
    .category { font-size: 10px; }
    .watch { padding: 8px 4px; font-size: 11px; }
    #player { padding: 10px; }
    .player-box { padding: 15px; }
    .player-controls-bar { flex-direction: column; align-items: stretch; }
    .nav-ep-group { width: 100%; justify-content: space-between; }
    .nav-ep-btn { flex: 1; justify-content: center; }
    .fs-button { width: 100%; justify-content: center; }
}
</style>
</head>

<body>

<header>
    <div class="header-content">
        <div class="logo">🎬 MovieShowRo</div>
        <input id="search" type="search" placeholder="🔎 Caută filme, seriale sau anime..." autocomplete="off">
        <nav>
            <button class="active" data-category="toate">🏠 Toate</button>
            <button data-category="filme">🎬 Filme</button>
            <button data-category="seriale">📺 Seriale</button>
            <button data-category="anime">🍥 Anime</button>
        </nav>
    </div>
</header>

<section class="hero">
    <h1>MovieShowRo</h1>
    <p>🎬 50 Filme • 📺 50 Seriale • 🍥 60 Anime</p>
</section>

<main>
    <div class="section-header">
        <h2 id="sectionTitle">Toate</h2>
        <span id="count">160 titluri</span>
    </div>

    <div id="grid" class="grid"></div>

    <div id="noResults">
        <h2>🔍 Nu am găsit nimic</h2>
        <p>Încearcă un alt nume.</p>
    </div>
</main>

<div id="player">
    <div class="player-box">
        <button id="close">✕</button>
        <h2 id="playerTitle">Titlu</h2>
        
        <div class="video-wrapper" id="videoArea"></div>

        <div class="player-controls-bar">
            <div class="nav-ep-group" id="epNavButtons" style="display: none;">
                <button class="nav-ep-btn" id="btnPrevEp" onclick="schimbaEpisodRelativ(-1)">
                    <i class="fa-solid fa-backward-step"></i> Ep. Anterior
                </button>
                <button class="nav-ep-btn" id="btnNextEp" onclick="schimbaEpisodRelativ(1)">
                    Ep. Următor <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>

            <button class="fs-button" onclick="toggleFullScreen()">
                <i class="fa-solid fa-expand"></i> Ecran Complet
            </button>
        </div>

        <div id="episodesArea" class="episodes-container"></div>
    </div>
</div>

<footer>
    🎬 MovieShowRo <br><br>
    Filme • Seriale • Anime <br><br>
    © 2026 MovieShowRo
</footer>

<script>
const DEFAULT_POSTER = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='450' viewBox='0 0 300 450'><rect width='100%' height='100%' fill='%23141414'/><text x='50%' y='50%' font-family='Arial' font-size='18' fill='%23666666' text-anchor='middle'>MovieShowRo</text></svg>";

const LISTA_FILME = [
    {
        id: 1,
        nume: "A Bronx Tale",
        imagine: DEFAULT_POSTER,
        video: "https://mixdrop.top/e/nl0r1lr8h807wk"
    },
    {
        id: 2,
        nume: "2 Fast 2 Furious",
        imagine: DEFAULT_POSTER,
        video: "https://mixdrop.top/e/wlnrkwvjt6we3x"
    },
    {
        id: 3,
        nume: "Snow White – Alba ca Zapada (2025)",
        imagine: DEFAULT_POSTER,
        video: "https://mixdrop.top/e/7kr69704so834r"
    },
    {
        id: 4,
        nume: "Child’s Play 2 – Jucăria 2 (1990)",
        imagine: DEFAULT_POSTER,
        video: "https://mixdrop.top/e/ow7r4kgnhlj9v67"
    }
];   

const LISTA_SERIALE = [
    {
        id: 51,
        nume: "Inazuma Eleven",
        imagine: DEFAULT_POSTER,
        episoade: [
            "https://mixdrop.top/e/jd9g9876a77remd",
            "https://mixdrop.top/e/nl0r06jwu7xvp0",
            "https://mixdrop.top/e/elnjn8qruxxev9",
            "https://mixdrop.top/e/pjkqe7qeug90gq",
            "https://mixdrop.top/e/wlnrezr7andxvv",
            "https://mixdrop.top/e/pjkqe7qoaexj88",
            "https://mixdrop.top/e/7kr6dx6dizdg8o",
            "https://mixdrop.top/e/dkqwlxkvi7r0rz",
            "https://mixdrop.top/e/k0nr380otrq3z1",
            "https://mixdrop.top/e/ow7r3q7vhl03gox",
            "https://mixdrop.top/e/7kr68wkru49p0q",
            "https://mixdrop.top/e/36nx87nqb68rk9",  
            "https://mixdrop.top/e/l76r3j7ebwqg4x",
            "https://mixdrop.top/e/elnjn8qruxxev9",
            "https://mixdrop.top/e/z1p0rxo0ugr0wl6",
            "https://mixdrop.top/e/z1p0rxpdcggkpvv",
            "https://mixdrop.top/e/nl0r4617czjj6x",
            "https://mixdrop.top/e/q1lrq8v6ukzdrz",
            "https://mixdrop.top/e/jd9gm8zwa99weq",
            "https://mixdrop.top/e/1nvj81ooh4nkx3",
            "https://mixdrop.top/e/dkqwlxroh7mp1vp",
            "https://mixdrop.top/e/9wn08pqnh3qdznl",
            "https://mixdrop.top/e/4dnz8kvrin9z7n",
            "https://mixdrop.top/e/1nvj81o3bk317o",
            "https://mixdrop.top/e/jd9gm8kkb8xqn",
            "https://mixdrop.top/e/gjnx6mxvidod0v",
        ]
    }
];

const LISTA_ANIME = [
    {
        id: 101,
        nume: "Dororo",
        imagine: DEFAULT_POSTER,
        episoade: [
            "https://mixdrop.top/e/03vwwk4xbk7goxg",
            "https://mixdrop.top/e/9wn009k6b3zjplw",
            "https://mixdrop.top/e/l76rrxezcz4039",
            "https://mixdrop.top/e/wlnrr1d9imnkke",
            "https://mixdrop.top/e/elnjjo1wu9rjp7",
            "https://mixdrop.top/e/nl0rr31ga0qez9",
            "https://mixdrop.top/e/jd9gglgqa9l0xz",
            "https://mixdrop.top/e/q1lrr4lkixxngm4",
            "https://mixdrop.top/e/jd9ggl1eul019k",
            "https://mixdrop.top/e/mkdrrmeoix6pwv9",
            "https://mixdrop.top/e/q1lrr43wtx86jx7",
            "https://mixdrop.top/e/ow7rrvjeixk8v3",
            "https://mixdrop.top/e/ow7rrv67t9wk6x",
            "https://mixdrop.top/e/67qggnk0u93gvq",
            "https://mixdrop.top/e/r6w44e73ip4m3x",
            "https://mixdrop.top/e/8l4dx9rgu666r00",
            "https://mixdrop.top/e/z1p0l9xvu6mvl4",
            "https://mixdrop.top/e/4dnzlo9osk4rre",
            "https://mixdrop.top/e/mkdrwj1xix6xzr",
            "https://mixdrop.top/e/gjnx6mknf8p89z",
            "https://mixdrop.top/e/elnjqr73hnqq0j",
            "https://mixdrop.top/e/xwo671pohlm0z81",
            "https://mixdrop.top/e/nl0rj84puljkd4o",
            "https://mixdrop.top/e/vknrd13jtkoro4",
        ]
    }
];

const continut = [];

for (let i = 1; i <= 50; i++) {
    const existent = LISTA_FILME.find(f => f.id === i);
    continut.push(existent || {
        id: i,
        nume: `Film ${i}`,
        imagine: DEFAULT_POSTER,
        video: ""
    });
}

// Generare Seriale (Dinamic în funcție de numărul de link-uri adăugate)
for (let i = 1; i <= 50; i++) {
    const id = 50 + i;
    const existent = LISTA_SERIALE.find(s => s.id === id);
    let epList = [];
    
    // Calculează câte episoade sunt în total (minim 12)
    const numarEpisoade = (existent && existent.episoade) ? Math.max(existent.episoade.length, 12) : 12;

    for (let ep = 1; ep <= numarEpisoade; ep++) {
        const url = (existent && existent.episoade && existent.episoade[ep - 1]) ? existent.episoade[ep - 1] : "";
        epList.push({ nr: ep, url: url });
    }
    continut.push({
        id: id,
        nume: existent ? existent.nume : `Serial ${i}`,
        imagine: existent ? existent.imagine : DEFAULT_POSTER,
        episoade: epList
    });
}

// Generare Anime (Dinamic în funcție de numărul de link-uri adăugate)
for (let i = 1; i <= 60; i++) {
    const id = 100 + i;
    const existent = LISTA_ANIME.find(a => a.id === id);
    let epList = [];
    
    // Calculează câte episoade sunt în total (minim 12)
    const numarEpisoade = (existent && existent.episoade) ? Math.max(existent.episoade.length, 12) : 12;

    for (let ep = 1; ep <= numarEpisoade; ep++) {
        const url = (existent && existent.episoade && existent.episoade[ep - 1]) ? existent.episoade[ep - 1] : "";
        epList.push({ nr: ep, url: url });
    }
    continut.push({
        id: id,
        nume: existent ? existent.nume : `Anime ${i}`,
        imagine: existent ? existent.imagine : DEFAULT_POSTER,
        episoade: epList
    });
}

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const count = document.getElementById("count");
const sectionTitle = document.getElementById("sectionTitle");
const noResults = document.getElementById("noResults");
const player = document.getElementById("player");
const playerTitle = document.getElementById("playerTitle");
const videoArea = document.getElementById("videoArea");
const episodesArea = document.getElementById("episodesArea");
const close = document.getElementById("close");
const categoryButtons = document.querySelectorAll("nav button");

const epNavButtons = document.getElementById("epNavButtons");
const btnPrevEp = document.getElementById("btnPrevEp");
const btnNextEp = document.getElementById("btnNextEp");

let categoriaActuala = "toate";
let itemCurent = null;
let episodCurentIndex = 0;

function categorie(item) {
    if (item.id <= 50) return "filme";
    if (item.id <= 100) return "seriale";
    return "anime";
}

function numeCategorie(cat) {
    if (cat === "filme") return "🎬 Film";
    if (cat === "seriale") return "📺 Serial";
    return "🍥 Anime";
}

function afiseaza() {
    const text = search.value.toLowerCase().trim();
    grid.innerHTML = "";

    const rezultate = continut.filter(item => {
        const cat = categorie(item);
        const categorieOK = categoriaActuala === "toate" || cat === categoriaActuala;
        const cautareOK = item.nume.toLowerCase().includes(text);
        return categorieOK && cautareOK;
    });

    count.textContent = `${rezultate.length} ${rezultate.length === 1 ? 'titlu' : 'titluri'}`;

    if (categoriaActuala === "toate") sectionTitle.textContent = "Toate";
    else if (categoriaActuala === "filme") sectionTitle.textContent = "🎬 Filme";
    else if (categoriaActuala === "seriale") sectionTitle.textContent = "📺 Seriale";
    else sectionTitle.textContent = "🍥 Anime";

    if (rezultate.length === 0) {
        noResults.style.display = "block";
        return;
    }
    noResults.style.display = "none";

    rezultate.forEach(item => {
        const card = document.createElement("article");
        card.className = "card";

        const img = document.createElement("img");
        img.className = "poster";
        img.src = item.imagine;
        img.alt = item.nume;
        img.loading = "lazy";

        const info = document.createElement("div");
        info.className = "info";

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = item.nume;

        const cat = document.createElement("div");
        cat.className = "category";
        cat.textContent = numeCategorie(categorie(item));

        const button = document.createElement("button");
        button.className = "watch";
        button.textContent = "▶️ Vezi acum";
        button.onclick = () => deschidePlayer(item);

        info.appendChild(title);
        info.appendChild(cat);
        info.appendChild(button);

        card.appendChild(img);
        card.appendChild(info);

        grid.appendChild(card);
    });
}

function incarcaSursaVideo(url) {
    videoArea.innerHTML = "";
    if (!url || url.trim() === "") {
        videoArea.innerHTML = "<div style='padding:50px;text-align:center;color:#777;'>Video indisponibil.</div>";
        return;
    }

    url = url.trim();
    if (/\.(mp4|webm|ogg|m3u8)(\?.*)?$/i.test(url)) {
        const video = document.createElement("video");
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.src = url;
        videoArea.appendChild(video);
    } else {
        const iframe = document.createElement("iframe");
        iframe.src = url;
        iframe.setAttribute("allowfullscreen", "true");
        iframe.setAttribute("webkitallowfullscreen", "true");
        iframe.setAttribute("mozallowfullscreen", "true");
        iframe.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media";
        videoArea.appendChild(iframe);
    }
}

function selecteazaEpisod(index) {
    if (!itemCurent || !itemCurent.episoade) return;
    
    episodCurentIndex = index;
    const ep = itemCurent.episoade[index];
    
    playerTitle.textContent = `${itemCurent.nume} - Episodul ${ep.nr}`;
    incarcaSursaVideo(ep.url);

    const epButtons = document.querySelectorAll(".ep-btn");
    epButtons.forEach((b, idx) => {
        if (idx === index) b.classList.add("active");
        else b.classList.remove("active");
    });

    btnPrevEp.disabled = (index === 0);
    btnNextEp.disabled = (index === itemCurent.episoade.length - 1);
}

function schimbaEpisodRelativ(directie) {
    const noulIndex = episodCurentIndex + directie;
    if (noulIndex >= 0 && noulIndex < itemCurent.episoade.length) {
        selecteazaEpisod(noulIndex);
    }
}

function deschidePlayer(item) {
    itemCurent = item;
    episodesArea.innerHTML = "";

    if (categorie(item) === "filme") {
        epNavButtons.style.display = "none";
        episodesArea.style.display = "none";
        playerTitle.textContent = item.nume;
        incarcaSursaVideo(item.video);
    } else {
        epNavButtons.style.display = "inline-flex";
        episodesArea.style.display = "block";

        const h3 = document.createElement("h3");
        h3.textContent = "Selectează Episodul:";
        
        const epGrid = document.createElement("div");
        epGrid.className = "episodes-grid";

        item.episoade.forEach((ep, index) => {
            const epBtn = document.createElement("button");
            epBtn.className = "ep-btn";
            epBtn.textContent = `Ep. ${ep.nr}`;
            epBtn.onclick = () => selecteazaEpisod(index);
            epGrid.appendChild(epBtn);
        });

        episodesArea.appendChild(h3);
        episodesArea.appendChild(epGrid);

        selecteazaEpisod(0);
    }

    player.classList.add("open");
    document.body.style.overflow = "hidden";
}

function inchidePlayer() {
    player.classList.remove("open");
    videoArea.innerHTML = "";
    episodesArea.innerHTML = "";
    document.body.style.overflow = "auto";
}

function toggleFullScreen() {
    const elem = document.getElementById("videoArea");
    if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
            elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
            elem.msRequestFullscreen();
        }
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}

close.onclick = inchidePlayer;

player.onclick = (e) => {
    if (e.target === player) inchidePlayer();
};

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && player.classList.contains('open')) {
        inchidePlayer();
    }
});

search.oninput = afiseaza;

categoryButtons.forEach(btn => {
    btn.onclick = () => {
        categoryButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        categoriaActuala = btn.dataset.category;
        afiseaza();
    };
});

afiseaza();
</script>
</body>
</html>
