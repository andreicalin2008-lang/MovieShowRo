            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #080808;
            color: white;
        }

        /* =========================
           MENIU
        ========================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 15px 30px;

            background: #111;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            white-space: nowrap;
        }

        .menu {
            display: flex;
            gap: 8px;
        }

        .menu button {
            padding: 10px 15px;

            border: none;
            border-radius: 7px;

            background: transparent;
            color: white;

            font-weight: bold;
            cursor: pointer;

            transition: 0.2s;
        }

        .menu button:hover {
            background: #e50914;
        }


        /* =========================
           PAGINI
        ========================= */

        .sectiune {
            display: none;

            min-height: calc(100vh - 70px);

            padding: 35px 20px;
        }

        .sectiune.activa {
            display: block;
        }


        /* =========================
           ACASA
        ========================= */

        .hero {
            max-width: 1100px;
            min-height: 430px;

            margin: 30px auto;
            padding: 60px 40px;

            display: flex;
            align-items: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    rgba(0,0,0,.95),
                    rgba(0,0,0,.5)
                ),
                url("images/film1.jpg");

            background-size: cover;
            background-position: center;
        }

        .hero-content {
            max-width: 650px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #e50914;
        }

        .hero p {
            color: #ddd;
            font-size: 18px;
            line-height: 1.5;

            margin-bottom: 25px;
        }

        .hero-button {
            padding: 13px 22px;

            border: none;
            border-radius: 7px;

            background: #e50914;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .hero-button:hover {
            background: #ff1f2d;
            transform: scale(1.03);
        }


        /* =========================
           TITLURI
        ========================= */

        .titlu {
            max-width: 1100px;

            margin: 10px auto 25px;

            font-size: 30px;

            border-left: 5px solid #e50914;

            padding-left: 12px;
        }


        /* =========================
           GRID FILME
        ========================= */

        .filme-grid {
            width: 100%;
            max-width: 1200px;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 25px;
        }


        /* =========================
           CARD
        ========================= */

        .card {
            width: 100%;

            padding: 12px;

            background: #181818;

            border-radius: 12px;

            text-align: center;

            transition:
                transform .2s,
                background .2s;
        }

        .card:hover {
            transform: translateY(-5px);
            background: #222;
        }

        .card img {
            width: 100%;
            height: 320px;

            object-fit: cover;

            border-radius: 8px;

            margin-bottom: 12px;
        }

        .card h3 {
            margin-bottom: 8px;

            min-height: 22px;
        }

        .card p {
            color: #aaa;

            margin-bottom: 15px;
        }

        .card button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 7px;

            background: #e50914;
            color: white;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .card button:hover {
            background: #ff1f2d;
        }


        /* =========================
           DESENE
        ========================= */

        .mesaj {
            max-width: 600px;

            margin: 60px auto;

            padding: 60px 20px;

            text-align: center;

            background: #181818;

            border-radius: 15px;
        }

        .mesaj-icon {
            font-size: 60px;

            margin-bottom: 15px;
        }

        .mesaj p {
            color: #aaa;

            margin-top: 10px;
        }


        /* =========================
           CATEGORII
        ========================= */

        .categorii {
            max-width: 900px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)

            gap: 15px;
        }

            padding: 25px;

            border-radius: 10px;

            background: #181818;
            color: white;

        }

        .categorii button:hover {
            background: #e50914;
        }


        /* ==================================================
           PLAYER NOU
        ================================================== */

        #player {
            display: none;

            position: fixed;

            inset: 0;

            z-index: 99999;

            background:
                radial-gradient(
                    circle at center,
                    #202020 0%,
                    #080808 70%
                );

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .player-box {
            position: relative;

            width: 95%;
            max-width: 1200px;

            background: #111;

            border-radius: 14px;

            padding: 12px;

            box-shadow:
                0 0 40px rgba(0,0,0,.8);
        }

           TITLU PLAYER
        ========================= */

        .player-title {
            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 8px 5px 12px;

            color: white;
        }

        .player-title h2 {
            font-size: 20px;
        }


        /* =========================
           IFRAME MIXDROP
        ========================= */

        #movieFrame {
            width: 100%;

            height: 650px;

            display: block;

            border: none;

            border-radius: 8px;

            background: black;
        }


        /* =========================
           BUTON INCHIDERE
        ========================= */

        .close {
            position: absolute;

            top: -55px;
            right: 0;

            width: 45px;
            height: 45px;

            border: none;
            border-radius: 50%;

            background: #e50914;

            color: white;

            font-size: 24px;

            cursor: pointer;

            z-index: 100000;

            transition: 0.2s;
        }

        .close:hover {
            background: #ff1f2d;

            transform: rotate(90deg);
        }


        /* =========================
           BUTON INAPOI
        ========================= */

        .back-button {
            margin-top: 12px;

            padding: 10px 18px;

            border: none;

            border-radius: 7px;

            background: #252525;

            color: white;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;
        }

        .back-button:hover {
            background: #e50914;
        }


        /* =========================
           MESAJ DACA NU EXISTA VIDEO
        ========================= */

        .no-video {
            width: 100%;

            height: 650px;

        }

        }

           TABLETA
        ========================= */

        }

           TELEFON
        ========================= */

            }

    </style>
</head>

        ================================================== */

        const filmeGrid =
            document.getElementById(
                "filmeGrid"
            );


        filme.forEach(function(film) {

            const card =
                document.createElement(
                    "div"
                );


            card.className = "card";


            card.innerHTML = `

                <img
                    src="images/film${film.id}.jpg"
                    alt="${film.nume}"
                    onerror="this.style.display='none'"
                >

                <h3>
                    ${film.nume}
                </h3>

                <p>
                    ${film.gen} • ${film.an}
                </p>

                <button
                    type="button"

                        ${film.id}
                    )">

                </button>

            `;


            filmeGrid.appendChild(card);

        });


        /* ==================================================
           DESCHIDE FILM
        ================================================== */

        function openMovie(filmId) {

            const film =
                filme.find(function(item) {

                    return item.id === filmId;

                });


            if (!film) {
                return;
            }


            const player =
                document.getElementById(
                    "player"
                );


            const frame =
                document.getElementById(
                    "movieFrame"
                );


            const title =
                document.getElementById(
                    "playerTitle"
                );


            title.textContent =
                "🎬 " + film.nume;


            /* ==================================================
               VERIFICAM DACA EXISTA LINK
            ================================================== */

            if (!film.video) {

                frame.src = "";

                frame.style.display = "none";


                const noVideo =
                    document.createElement(
                        "div"
                    );

                noVideo.id = "noVideo";

                noVideo.className =
                    "no-video";


                noVideo.innerHTML = `

                    <div class="no-video-icon">
                        🎬
                    </div>

                    <h2>
                        Filmul nu este disponibil încă
                    </h2>

                    <p>
                        Linkul video nu a fost adăugat.
                    </p>

                `;


                frame.parentNode.insertBefore(
                    noVideo,
                    frame
                );

            } else {

                const oldMessage =
                    document.getElementById(
                        "noVideo"
                    );


                if (oldMessage) {
                    oldMessage.remove();
                }


                frame.style.display =
                    "block";


                frame.src =
                    film.video;

            }


            /* ==================================================
               AFISAM PLAYERUL
            ================================================== */

            player.style.display =
                "flex";


            document.body.style.overflow =
                "hidden";

        }


        /* ==================================================
           INCHIDE FILM
        ================================================== */

        function closeMovie() {

            const player =
                document.getElementById(
                    "player"
                );


            const frame =
                document.getElementById(
                    "movieFrame"
                );


            frame.src = "";


            const oldMessage =
                document.getElementById(
                    "noVideo"
                );


            if (oldMessage) {
                oldMessage.remove();
            }


            player.style.display =
                "none";


            document.body.style.overflow =
                "auto";

        }


        /* ==================================================
           ESC = INCHIDE PLAYERUL
        ================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    closeMovie();

                }

            }
        );


    </script>

</body>
</html>
