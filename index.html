<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieShowRo</title>

<style>
/* ==============================
   RESET & BASE STYLES
============================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080808;
    color: white;
}

/* ==============================
   HEADER
============================== */
header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #111;
    border-bottom: 2px solid #e50914;
    padding: 15px;
}

.header-content {
    max-width: 1400px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
}

.logo {
    color: #e50914;
    font-size: 27px;
    font-weight: bold;
}

#search {
    width: 100%;
    max-width: 500px;
    padding: 12px 18px;
    border: 1px solid #333;
    border-radius: 25px;
    outline: none;
    background: #222;
    color: white;
    font-size: 15px;
}

nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

nav button {
    border: none;
    padding: 10px 15px;
    border-radius: 20px;
    background: #292929;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

nav button:hover,
nav button.active {
    background: #e50914;
}

/* ==============================
   HERO & MAIN
============================== */
.hero {
    text-align: center;
    padding: 55px 20px;
    background: linear-gradient(#202020, #080808);
}

.hero h1 {
    font-size: 45px;
    color: #e50914;
    margin-bottom: 10px;
}

.hero p {
    color: #aaa;
    font-size: 17px;
}

main {
    max-width: 1450px;
    margin: auto;
    padding: 30px 20px 50px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-left: 4px solid #e50914;
    padding-left: 12px;
}

.section-header h2 {
    font-size: 25px;
}

#count {
    color: #777;
    font-size: 13px;
}

/* ==============================
   GRID & CARDS
============================== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 20px;
}

.card {
    background: #151515;
    border: 1px solid #252525;
    border-radius: 10px;
    overflow: hidden;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #444;
}

.poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
    background: #252525;
}

.info {
    padding: 11px;
}

.title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 7px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.category {
    color: #888;
    font-size: 12px;
    margin-bottom: 10px;
}

.watch {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 5px;
    background: #e50914;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.watch:hover {
    background: #f51a25;
}

#noResults {
    display: none;
    text-align: center;
    padding: 70px 20px;
    color: #888;
}

/* ==============================
   PLAYER & EPISODE SELECTOR
============================== */
#player {
    position: fixed;
    inset: 0;
    z-index: 5000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 15px;
    background: rgba(0, 0, 0, 0.96);
}

#player.open {
    display: flex;
}

.player-box {
    position: relative;
    width: 100%;
    max-width: 1050px;
    background: #151515;
    border-radius: 10px;
    padding: 20px;
    max-height: 95vh;
    overflow-y: auto;
}

#close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: #e50914;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

#playerTitle {
    padding-right: 50px;
    margin-bottom: 15px;
}

#videoArea {
    width: 100%;
    background: black;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 15px;
}

#videoArea video {
    width: 100%;
    display: block;
    max-height: 60vh;
}

#videoArea iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: none;
    display: block;
}

.episodes-container {
    margin-top: 15px;
}

.episodes-container h3 {
    font-size: 16px;
    margin-bottom: 10px;
    color: #ddd;
}

.episodes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
}

.ep-btn {
    padding: 8px;
    background: #252525;
    border: 1px solid #333;
    color: white;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
}

.ep-btn:hover, .ep-btn.active {
    background: #e50914;
    border-color: #e50914;
}

footer {
    text-align: center;
    padding: 35px 20px;
    border-top: 1px solid #222;
    color: #666;
}

@media (max-width: 700px) {
    .header-content { justify-content: center; }
    .logo { width: 100%; text-align: center; font-size: 23px; }
    #search { max-width: none; }
    nav { width: 100%; justify-content: center; }
    nav button { padding: 8px 10px; font-size: 11px; }
    .hero { padding: 40px 15px; }
    .hero h1 { font-size: 32px; }
    main { padding: 20px 10px 40px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .info { padding: 8px; }
    .title { font-size: 13px; }
    .category { font-size: 10px; }
    .watch { padding: 8px 4px; font-size: 11px; }
    #player { padding: 7px; }
    .player-box { padding: 12px; }
}
</style>
</head>

<body>

<header>
    <div class="header-content">
        <div class="logo">🎬 MovieShowRo</div>
        <input id="search" type="search" placeholder="🔎 Caută filme, seriale sau anime..." autocomplete="off">
        <nav>
            <button class="active" data-category="toate">🏠 Toate</button>
            <button data-category="filme">🎬 Filme</button>
            <button data-category="seriale">📺 Seriale</button>
            <button data-category="anime">🍥 Anime</button>
        </nav>
    </div>
</header>

<section class="hero">
    <h1>MovieShowRo</h1>
    <p>🎬 50 Filme • 📺 50 Seriale (12 Ep) • 🍥 60 Anime (12 Ep)</p>
</section>

<main>
    <div class="section-header">
        <h2 id="sectionTitle">Toate</h2>
        <span id="count">160 titluri</span>
    </div>

    <div id="grid" class="grid"></div>

    <div id="noResults">
        <h2>🔍 Nu am găsit nimic</h2>
        <p>Încearcă un alt nume.</p>
    </div>
</main>

<div id="player">
    <div class="player-box">
        <button id="close">✕</button>
        <h2 id="playerTitle">Titlu</h2>
        <div id="videoArea"></div>
        <div id="episodesArea" class="episodes-container"></div>
    </div>
</div>

<footer>
    🎬 MovieShowRo <br><br>
    Filme • Seriale • Anime <br><br>
    © 2026 MovieShowRo
</footer>

<script>
/* =========================================================
   1. CONFIGURARE FILME (ID 1 -> 50)
   Aici modifici/adaugi nume, imagine si link video.
========================================================= */
const LISTA_FILME = [
    {
        id: 1,
        nume: "Abronx tale",
        imagine: "images/film1.jpg",
        video: "https://mixdrop.top/e/nl0r1lr8h807wk"
    },
    {
        id: 2,
        nume: "2 Fast 2 Furious",
        imagine: "images/film2.jpg",
        video: "https://mixdrop.top/e/wlnrkwvjt6we3x"
    },
    {
        id: 3,
        nume: "Snow White (2025)",
        imagine: "images/film3.jpg",
        video: "https://mixdrop.top/e/7kr69704so834r"
    },
    {
        id: 4,
        nume: "Child's Play 2",
        imagine: "images/film4.jpg",
        video: "https://mixdrop.top/e/ow7r4kgnhlj9v67"
    }
    // Adaugi restul filmelor in acelasi format...
];

/* =========================================================
   2. CONFIGURARE SERIALE (ID 51 -> 100)
   Adaugi numele, imaginea si o lista cu link-urile episoadelor.
========================================================= */
const LISTA_SERIALE = [
    {
        id: 51,
        nume: "Inazuma eleven ",
        imagine: "images/serial1.jpg",
        episoade: [
            "https://mixdrop.top/e/jd9g9876a77remd",
            "https://mixdrop.top/e/nl0r06jwu7xvp0",
            "https://mixdrop.top/e/elnjn8qruxxev9"
            
        ]
    },
    {
        id: 52,
        nume: "Serialul Exemplu 2",
        imagine: "images/serial2.jpg",
        episoade: [
            "https://link-ep1.com",
            "https://link-ep2.com"
        ]
    }
    // Adaugi restul serialelor in acelasi format...
];

/* =========================================================
   3. CONFIGURARE ANIME (ID 101 -> 160)
========================================================= */
const LISTA_ANIME = [
    {
        id: 101,
        nume: "Anime Exemplu 1",
        imagine: "images/anime1.jpg",
        episoade: [
            "https://link-anime-ep1.com",
            "https://link-anime-ep2.com"
        ]
    }
    // Adaugi restul anime-urilor in acelasi format...
];


/* =========================================================
   GENERARE AUTOMATĂ STRUCTURĂ DATE (NEMODIFICAT)
========================================================= */
const continut = [];

// 1. Procesare Filme (ID 1 -> 50)
for (let i = 1; i <= 50; i++) {
    const existent = LISTA_FILME.find(f => f.id === i);
    if (existent) {
        continut.push(existent);
    } else {
        continut.push({
            id: i,
            nume: `Film ${i}`,
            imagine: `images/film${i}.jpg`,
            video: ""
        });
    }
}

// 2. Procesare Seriale (ID 51 -> 100)
for (let i = 1; i <= 50; i++) {
    const id = 50 + i;
    const existent = LISTA_SERIALE.find(s => s.id === id);
    
    let epList = [];
    for (let ep = 1; ep <= 12; ep++) {
        const url = (existent && existent.episoade && existent.episoade[ep - 1]) ? existent.episoade[ep - 1] : "";
        epList.push({ nr: ep, url: url });
    }

    continut.push({
        id: id,
        nume: existent ? existent.nume : `Serial ${i}`,
        imagine: existent ? existent.imagine : `images/serial${i}.jpg`,
        episoade: epList
    });
}

// 3. Procesare Anime (ID 101 -> 160)
for (let i = 1; i <= 60; i++) {
    const id = 100 + i;
    const existent = LISTA_ANIME.find(a => a.id === id);
    
    let epList = [];
    for (let ep = 1; ep <= 12; ep++) {
        const url = (existent && existent.episoade && existent.episoade[ep - 1]) ? existent.episoade[ep - 1] : "";
        epList.push({ nr: ep, url: url });
    }

    continut.push({
        id: id,
        nume: existent ? existent.nume : `Anime ${i}`,
        imagine: existent ? existent.imagine : `images/anime${i}.jpg`,
        episoade: epList
    });
}

/* =========================================================
   LOGICĂ INTERFAȚĂ & PLAYER (NEMODIFICAT)
========================================================= */
const grid = document.getElementById("grid");
const search = document.getElementById("search");
const count = document.getElementById("count");
const sectionTitle = document.getElementById("sectionTitle");
const noResults = document.getElementById("noResults");
const player = document.getElementById("player");
const playerTitle = document.getElementById("playerTitle");
const videoArea = document.getElementById("videoArea");
const episodesArea = document.getElementById("episodesArea");
const close = document.getElementById("close");
const categoryButtons = document.querySelectorAll("nav button");

let categoriaActuala = "toate";

function categorie(item) {
    if (item.id <= 50) return "filme";
    if (item.id <= 100) return "seriale";
    return "anime";
}

function numeCategorie(cat) {
    if (cat === "filme") return "🎬 Film";
    if (cat === "seriale") return "📺 Serial";
    return "🍥 Anime";
}

function afiseaza() {
    const text = search.value.toLowerCase().trim();
    grid.innerHTML = "";

    const rezultate = continut.filter(item => {
        const cat = categorie(item);
        const categorieOK = categoriaActuala === "toate" || cat === categoriaActuala;
        const cautareOK = item.nume.toLowerCase().includes(text);
        return categorieOK && cautareOK;
    });

    count.textContent = `${rezultate.length} ${rezultate.length === 1 ? 'titlu' : 'titluri'}`;

    if (categoriaActuala === "toate") sectionTitle.textContent = "Toate";
    else if (categoriaActuala === "filme") sectionTitle.textContent = "🎬 Filme";
    else if (categoriaActuala === "seriale") sectionTitle.textContent = "📺 Seriale";
    else sectionTitle.textContent = "🍥 Anime";

    if (rezultate.length === 0) {
        noResults.style.display = "block";
        return;
    }
    noResults.style.display = "none";

    rezultate.forEach(item => {
        const card = document.createElement("article");
        card.className = "card";

        const img = document.createElement("img");
        img.className = "poster";
        img.src = item.imagine;
        img.alt = item.nume;
        img.loading = "lazy";

        const info = document.createElement("div");
        info.className = "info";

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = item.nume;

        const cat = document.createElement("div");
        cat.className = "category";
        cat.textContent = numeCategorie(categorie(item));

        const button = document.createElement("button");
        button.className = "watch";
        button.textContent = "▶️ Vezi acum";
        button.onclick = () => deschidePlayer(item);

        info.appendChild(title);
        info.appendChild(cat);
        info.appendChild(button);

        card.appendChild(img);
        card.appendChild(info);

        grid.appendChild(card);
    });
}

function incarcaSursaVideo(url) {
    videoArea.innerHTML = "";
    if (!url || url.trim() === "") {
        videoArea.innerHTML = "<div style='padding:50px;text-align:center;color:#777;'>Video indisponibil.</div>";
        return;
    }

    url = url.trim();
    if (/\.(mp4|webm|ogg|m3u8)(\?.*)?$/i.test(url)) {
        const video = document.createElement("video");
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.src = url;
        videoArea.appendChild(video);
    } else {
        const iframe = document.createElement("iframe");
        iframe.src = url;
        iframe.allow = "autoplay; fullscreen; picture-in-picture";
        iframe.allowFullscreen = true;
        videoArea.appendChild(iframe);
    }
}

function deschidePlayer(item) {
    playerTitle.textContent = item.nume;
    episodesArea.innerHTML = "";

    if (categorie(item) === "filme") {
        incarcaSursaVideo(item.video);
    } else {
        const h3 = document.createElement("h3");
        h3.textContent = "Selectează Episodul:";
        
        const epGrid = document.createElement("div");
        epGrid.className = "episodes-grid";

        item.episoade.forEach((ep, index) => {
            const epBtn = document.createElement("button");
            epBtn.className = "ep-btn";
            if (index === 0) epBtn.classList.add("active");
            epBtn.textContent = `Ep. ${ep.nr}`;
            epBtn.onclick = () => {
                document.querySelectorAll(".ep-btn").forEach(b => b.classList.remove("active"));
                epBtn.classList.add("active");
                incarcaSursaVideo(ep.url);
            };
            epGrid.appendChild(epBtn);
        });

        episodesArea.appendChild(h3);
        episodesArea.appendChild(epGrid);
        
        incarcaSursaVideo(item.episoade[0].url);
    }

    player.classList.add("open");
    document.body.style.overflow = "hidden";
}

function inchidePlayer() {
    player.classList.remove("open");
    videoArea.innerHTML = "";
    episodesArea.innerHTML = "";
    document.body.style.overflow = "auto";
}

close.onclick = inchidePlayer;

player.onclick = (e) => {
    if (e.target === player) inchidePlayer();
};

search.oninput = afiseaza;

categoryButtons.forEach(btn => {
    btn.onclick = () => {
        categoryButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        categoriaActuala = btn.dataset.category;
        afiseaza();
    };
});

afiseaza();
</script>
</body>
</html>
