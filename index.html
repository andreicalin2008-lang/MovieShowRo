<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieShowRo</title>

<style>
/* ==============================
   RESET & BASE STYLES
============================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    background: #080808;
    color: white;
}

/* ==============================
   HEADER
============================== */
header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(17, 17, 17, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 2px solid #e50914;
    padding: 15px;
}

.header-content {
    max-width: 1400px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
}

.logo {
    color: #e50914;
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 0.5px;
}

#search {
    width: 100%;
    max-width: 500px;
    padding: 12px 18px;
    border: 1px solid #333;
    border-radius: 25px;
    outline: none;
    background: #222;
    color: white;
    font-size: 15px;
    transition: 0.2s;
}

#search:focus {
    border-color: #e50914;
    box-shadow: 0 0 10px rgba(229, 9, 20, 0.3);
}

nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

nav button {
    border: none;
    padding: 10px 16px;
    border-radius: 20px;
    background: #222;
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

nav button:hover,
nav button.active {
    background: #e50914;
}

/* ==============================
   HERO & MAIN
============================== */
.hero {
    text-align: center;
    padding: 55px 20px;
    background: linear-gradient(#1c1c1c, #080808);
}

.hero h1 {
    font-size: 45px;
    color: #e50914;
    margin-bottom: 10px;
}

.hero p {
    color: #aaa;
    font-size: 17px;
}

main {
    max-width: 1450px;
    margin: auto;
    padding: 30px 20px 50px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-left: 4px solid #e50914;
    padding-left: 12px;
}

.section-header h2 {
    font-size: 25px;
}

#count {
    color: #777;
    font-size: 13px;
}

/* ==============================
   GRID & CARDS
============================== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 20px;
}

.card {
    background: #141414;
    border: 1px solid #222;
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #444;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
}

.poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
    background: #222;
}

.info {
    padding: 12px;
}

.title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.category {
    color: #888;
    font-size: 12px;
    margin-bottom: 12px;
}

.watch {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 6px;
    background: #e50914;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.watch:hover {
    background: #f51a25;
}

#noResults {
    display: none;
    text-align: center;
    padding: 70px 20px;
    color: #888;
}

/* ==============================
   CINEMA MODE PLAYER OVERLAY
============================== */
#player {
    position: fixed;
    inset: 0;
    z-index: 5000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(10px);
}

#player.open {
    display: flex;
}

.player-box {
    position: relative;
    width: 100%;
    max-width: 1100px;
    background: #121318;
    border-radius: 16px;
    padding: 20px;
    max-height: 95vh;
    overflow-y: auto;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
}

#close {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: #252525;
    color: white;
    font-size: 18px;
    cursor: pointer;
    z-index: 10;
    transition: 0.2s;
}

#close:hover {
    background: #e50914;
    transform: scale(1.1);
}

#playerTitle {
    padding-right: 50px;
    margin-bottom: 15px;
    font-size: 22px;
    color: #fff;
}

.video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
}

.video-wrapper video {
    width: 100%;
    height: 100%;
    display: block;
}

.video-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

/* Control & Fullscreen Bar */
.player-controls-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
    gap: 15px;
    flex-wrap: wrap;
}

.fs-button {
    background: linear-gradient(135deg, #e50914 0%, #b20710 100%);
    color: white;
    border: none;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
}

.fs-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(229, 9, 20, 0.5);
}

/* EPISODES SELECTOR */
.episodes-container {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #222;
}

.episodes-container h3 {
    font-size: 16px;
    margin-bottom: 12px;
    color: #ddd;
}

.episodes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
    gap: 10px;
}

.ep-btn {
    padding: 10px;
    background: #1c1d24;
    border: 1px solid #2a2b36;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: 0.2s;
}

.ep-btn:hover, .ep-btn.active {
    background: #e50914;
    border-color: #e50914;
    box-shadow: 0 2px 10px rgba(229, 9, 20, 0.4);
}

footer {
    text-align: center;
    padding: 35px 20px;
    border-top: 1px solid #222;
    color: #666;
}

@media (max-width: 700px) {
    .header-content { justify-content: center; }
    .logo { width: 100%; text-align: center; font-size: 23px; }
    #search { max-width: none; }
    nav { width: 100%; justify-content: center; }
    nav button { padding: 8px 10px; font-size: 11px; }
    .hero { padding: 40px 15px; }
    .hero h1 { font-size: 32px; }
    main { padding: 20px 10px 40px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .info { padding: 8px; }
    .title { font-size: 13px; }
    .category { font-size: 10px; }
    .watch { padding: 8px 4px; font-size: 11px; }
    #player { padding: 10px; }
    .player-box { padding: 15px; }
    .player-controls-bar { flex-direction: column; align-items: stretch; }
    .fs-button { width: 100%; justify-content: center; }
}
</style>
</head>

<body>

<header>
    <div class="header-content">
        <div class="logo">🎬 MovieShowRo</div>
        <input id="search" type="search" placeholder="🔎 Caută filme, seriale sau anime..." autocomplete="off">
        <nav>
            <button class="active" data-category="toate">🏠 Toate</button>
            <button data-category="filme">🎬 Filme</button>
            <button data-category="seriale">📺 Seriale</button>
            <button data-category="anime">🍥 Anime</button>
        </nav>
    </div>
</header>

<section class="hero">
    <h1>MovieShowRo</h1>
    <p>🎬 50 Filme • 📺 50 Seriale (12 Ep) • 🍥 60 Anime (12 Ep)</p>
</section>

<main>
    <div class="section-header">
        <h2 id="sectionTitle">Toate</h2>
        <span id="count">160 titluri</span>
    </div>

    <div id="grid" class="grid"></div>

    <div id="noResults">
        <h2>🔍 Nu am găsit nimic</h2>
        <p>Încearcă un alt nume.</p>
    </div>
</main>

<!-- CINEMA MODE PLAYER OVERLAY -->
<div id="player">
    <div class="player-box">
        <button id="close">✕</button>
        <h2 id="playerTitle">Titlu</h2>
        
        <!-- Cadrul Video Principal -->
        <div class="video-wrapper" id="videoArea"></div>

        <!-- Control Bar & Fullscreen Button -->
        <div class="player-controls-bar">
            <span style="color:#aaa; font-size:13px;">💡 Apasă pe buton pentru a extinde clipul pe tot ecranul:</span>
            <button class="fs-button" onclick="toggleFullScreen()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
                📺 Ecran Complet (Forțat)
            </button>
        </div>

        <div id="episodesArea" class="episodes-container"></div>
    </div>
</div>

<footer>
    🎬 MovieShowRo <br><br>
    Filme • Seriale • Anime <br><br>
    © 2026 MovieShowRo
</footer>

<script>
/* =========================================================
   1. CONFIGURARE FILME (ID 1 -> 50)
========================================================= */
const LISTA_FILME = [
    {
        id: 1,
        nume: "Abronx tale",
        imagine: "images/film1.jpg",
        video: "https://mixdrop.top/e/nl0r1lr8h807wk"
    },
    {
        id: 2,
        nume: "2 Fast 2 Furious",
        imagine: "images/film2.jpg",
        video: "https://mixdrop.top/e/wlnrkwvjt6we3x"
    },
    {
        id: 3,
        nume: "Snow White (2025)",
        imagine: "images/film3.jpg",
        video: "https://link-film-3.com"
    },
    {
        id: 4,
        nume: "Child's Play 2",
        imagine: "images/film4.jpg",
        video: "https://link-film-4.com"
    }
];

/* =========================================================
   2. CONFIGURARE SERIALE (ID 51 -> 100)
========================================================= */
const LISTA_SERIALE = [
    {
        id: 51,
        nume: "Serialul Exemplu 1",
        imagine: "images/serial1.jpg",
        episoade: [
            "https://link-ep1.com",
            "https://link-ep2.com",
            "https://link-ep3.com"
        ]
    }
];

/* =========================================================
   3. CONFIGURARE ANIME (ID 101 -> 160)
========================================================= */
const LISTA_ANIME = [
    {
        id: 101,
        nume: "Anime Exemplu 1",
        imagine: "images/anime1.jpg",
        episoade: [
            "https://link-anime-ep1.com",
            "https://link-anime-ep2.com"
        ]
    }
];

/* GENERARE AUTOMATĂ STRUCTURĂ DATE */
const continut = [];

for (let i = 1; i <= 50; i++) {
    const existent = LISTA_FILME.find(f => f.id === i);
    if (existent) {
        continut.push(existent);
    } else {
        continut.push({
            id: i,
            nume: `Film ${i}`,
            imagine: `images/film${i}.jpg`,
            video: ""
        });
    }
}

for (let i = 1; i <= 50; i++) {
    const id = 50 + i;
    const existent = LISTA_SERIALE.find(s => s.id === id);
    
    let epList = [];
    for (let ep = 1; ep <= 12; ep++) {
        const url = (existent && existent.episoade && existent.episoade[ep - 1]) ? existent.episoade[ep - 1] : "";
        epList.push({ nr: ep, url: url });
    }

    continut.push({
        id: id,
        nume: existent ? existent.nume : `Serial ${i}`,
        imagine: existent ? existent.imagine : `images/serial${i}.jpg`,
        episoade: epList
    });
}

for (let i = 1; i <= 60; i++) {
    const id = 100 + i;
    const existent = LISTA_ANIME.find(a => a.id === id);
    
    let epList = [];
    for (let ep = 1; ep <= 12; ep++) {
        const url = (existent && existent.episoade && existent.episoade[ep - 1]) ? existent.episoade[ep - 1] : "";
        epList.push({ nr: ep, url: url });
    }

    continut.push({
        id: id,
        nume: existent ? existent.nume : `Anime ${i}`,
        imagine: existent ? existent.imagine : `images/anime${i}.jpg`,
        episoade: epList
    });
}

/* LOGICĂ INTERFAȚĂ & PLAYER */
const grid = document.getElementById("grid");
const search = document.getElementById("search");
const count = document.getElementById("count");
const sectionTitle = document.getElementById("sectionTitle");
const noResults = document.getElementById("noResults");
const player = document.getElementById("player");
const playerTitle = document.getElementById("playerTitle");
const videoArea = document.getElementById("videoArea");
const episodesArea = document.getElementById("episodesArea");
const close = document.getElementById("close");
const categoryButtons = document.querySelectorAll("nav button");

let categoriaActuala = "toate";

function categorie(item) {
    if (item.id <= 50) return "filme";
    if (item.id <= 100) return "seriale";
    return "anime";
}

function numeCategorie(cat) {
    if (cat === "filme") return "🎬 Film";
    if (cat === "seriale") return "📺 Serial";
    return "🍥 Anime";
}

function afiseaza() {
    const text = search.value.toLowerCase().trim();
    grid.innerHTML = "";

    const rezultate = continut.filter(item => {
        const cat = categorie(item);
        const categorieOK = categoriaActuala === "toate" || cat === categoriaActuala;
        const cautareOK = item.nume.toLowerCase().includes(text);
        return categorieOK && cautareOK;
    });

    count.textContent = `${rezultate.length} ${rezultate.length === 1 ? 'titlu' : 'titluri'}`;

    if (categoriaActuala === "toate") sectionTitle.textContent = "Toate";
    else if (categoriaActuala === "filme") sectionTitle.textContent = "🎬 Filme";
    else if (categoriaActuala === "seriale") sectionTitle.textContent = "📺 Seriale";
    else sectionTitle.textContent = "🍥 Anime";

    if (rezultate.length === 0) {
        noResults.style.display = "block";
        return;
    }
    noResults.style.display = "none";

    rezultate.forEach(item => {
        const card = document.createElement("article");
        card.className = "card";

        const img = document.createElement("img");
        img.className = "poster";
        img.src = item.imagine;
        img.alt = item.nume;
        img.loading = "lazy";

        const info = document.createElement("div");
        info.className = "info";

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = item.nume;

        const cat = document.createElement("div");
        cat.className = "category";
        cat.textContent = numeCategorie(categorie(item));

        const button = document.createElement("button");
        button.className = "watch";
        button.textContent = "▶️ Vezi acum";
        button.onclick = () => deschidePlayer(item);

        info.appendChild(title);
        info.appendChild(cat);
        info.appendChild(button);

        card.appendChild(img);
        card.appendChild(info);

        grid.appendChild(card);
    });
}

function incarcaSursaVideo(url) {
    videoArea.innerHTML = "";
    if (!url || url.trim() === "") {
        videoArea.innerHTML = "<div style='padding:50px;text-align:center;color:#777;'>Video indisponibil.</div>";
        return;
    }

    url = url.trim();
    if (/\.(mp4|webm|ogg|m3u8)(\?.*)?$/i.test(url)) {
        const video = document.createElement("video");
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.src = url;
        videoArea.appendChild(video);
    } else {
        const iframe = document.createElement("iframe");
        iframe.src = url;
        iframe.setAttribute("allowfullscreen", "true");
        iframe.setAttribute("webkitallowfullscreen", "true");
        iframe.setAttribute("mozallowfullscreen", "true");
        iframe.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media";
        videoArea.appendChild(iframe);
    }
}

function deschidePlayer(item) {
    playerTitle.textContent = item.nume;
    episodesArea.innerHTML = "";

    if (categorie(item) === "filme") {
        episodesArea.style.display = "none";
        incarcaSursaVideo(item.video);
    } else {
        episodesArea.style.display = "block";
        const h3 = document.createElement("h3");
        h3.textContent = "Selectează Episodul:";
        
        const epGrid = document.createElement("div");
        epGrid.className = "episodes-grid";

        item.episoade.forEach((ep, index) => {
            const epBtn = document.createElement("button");
            epBtn.className = "ep-btn";
            if (index === 0) epBtn.classList.add("active");
            epBtn.textContent = `Ep. ${ep.nr}`;
            epBtn.onclick = () => {
                document.querySelectorAll(".ep-btn").forEach(b => b.classList.remove("active"));
                epBtn.classList.add("active");
                incarcaSursaVideo(ep.url);
            };
            epGrid.appendChild(epBtn);
        });

        episodesArea.appendChild(h3);
        episodesArea.appendChild(epGrid);
        
        incarcaSursaVideo(item.episoade[0].url);
    }

    player.classList.add("open");
    document.body.style.overflow = "hidden";
}

function inchidePlayer() {
    player.classList.remove("open");
    videoArea.innerHTML = "";
    episodesArea.innerHTML = "";
    document.body.style.overflow = "auto";
}

/* FUNCȚIE PENTRU FULLSCREEN FORȚAT */
function toggleFullScreen() {
    const elem = document.getElementById("videoArea");
    if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
            elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) { /* Safari */
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { /* IE11 */
            elem.msRequestFullscreen();
        }
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}

close.onclick = inchidePlayer;

player.onclick = (e) => {
    if (e.target === player) inchidePlayer();
};

search.oninput = afiseaza;

categoryButtons.forEach(btn => {
    btn.onclick = () => {
        categoryButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        categoriaActuala = btn.dataset.category;
        afiseaza();
    };
});

afiseaza();
</script>
</body>
</html>
