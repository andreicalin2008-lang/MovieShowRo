<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MovieShowRo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

/* =========================
   HEADER
========================= */

.header {
    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 15px 30px;

    background: #111;
    border-bottom: 1px solid #333;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    white-space: nowrap;
}

.menu {
    display: flex;
    gap: 8px;
}

.menu button {
    padding: 10px 15px;
    border: none;
    border-radius: 7px;

    background: transparent;
    color: white;

    font-weight: bold;
    cursor: pointer;

    transition: .2s;
}

.menu button:hover,
.menu button.activ {
    background: #e50914;
}


/* =========================
   PAGINI
========================= */

.sectiune {
    display: none;
    min-height: calc(100vh - 70px);
    padding: 35px 20px;
}

.sectiune.activa {
    display: block;
}


/* =========================
   ACASA
========================= */

.hero {
    max-width: 1100px;
    min-height: 430px;

    margin: 30px auto;
    padding: 60px 40px;

    display: flex;
    align-items: center;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.95),
            rgba(0,0,0,.5)
        ),
        url("images/film1.jpg");

    background-size: cover;
    background-position: center;
}

.hero-content {
    max-width: 650px;
}

.hero h1 {
    font-size: 48px;
    margin-bottom: 20px;
}

.hero h1 span {
    color: #e50914;
}

.hero p {
    color: #ddd;
    font-size: 18px;
    line-height: 1.5;
    margin-bottom: 25px;
}

.hero-button {
    padding: 13px 22px;

    border: none;
    border-radius: 7px;

    background: #e50914;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.hero-button:hover {
    background: #ff1f2d;
}


/* =========================
   TITLURI
========================= */

.titlu {
    max-width: 1200px;
    margin: 10px auto 25px;

    font-size: 30px;

    border-left: 5px solid #e50914;
    padding-left: 12px;
}


/* =========================
   FILTRE
========================= */

.filtre {
    max-width: 1200px;

    margin: 0 auto 25px;

    display: flex;
    flex-wrap: wrap;

    gap: 10px;
}

.filtru {
    padding: 10px 16px;

    border: 1px solid #333;
    border-radius: 8px;

    background: #181818;
    color: white;

    cursor: pointer;

    transition: .2s;
}

.filtru:hover,
.filtru.activ {
    background: #e50914;
    border-color: #e50914;
}


/* =========================
   GRID
========================= */

.filme-grid {
    width: 100%;
    max-width: 1200px;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 25px;
}


/* =========================
   CARD
========================= */

.card {
    width: 100%;

    padding: 12px;

    background: #181818;

    border-radius: 12px;

    text-align: center;

    transition: .2s;
}

.card:hover {
    transform: translateY(-5px);
    background: #222;
}

.card img {
    width: 100%;
    height: 320px;

    object-fit: cover;

    border-radius: 8px;

    margin-bottom: 12px;
}

.card h3 {
    margin-bottom: 8px;
}

.card p {
    color: #aaa;
    margin-bottom: 15px;
}

.card .tip {
    display: inline-block;

    padding: 4px 8px;

    margin-bottom: 10px;

    border-radius: 5px;

    background: #292929;

    color: #ddd;

    font-size: 12px;
}

.card button {
    width: 100%;

    padding: 12px;

    border: none;
    border-radius: 7px;

    background: #e50914;
    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.card button:hover {
    background: #ff1f2d;
}


/* =========================
   PAGINA DESENE / ANIME
========================= */

.mesaj {
    max-width: 600px;

    margin: 60px auto;

    padding: 60px 20px;

    text-align: center;

    background: #181818;

    border-radius: 15px;
}

.mesaj-icon {
    font-size: 60px;
    margin-bottom: 15px;
}

.mesaj p {
    color: #aaa;
    margin-top: 10px;
}


/* =========================
   CATEGORII
========================= */

.categorii {
    max-width: 900px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px, 1fr)
        );

    gap: 15px;
}

.categorii button {
    padding: 25px;

    border: 1px solid #333;
    border-radius: 10px;

    background: #181818;
    color: white;

    font-size: 17px;

    cursor: pointer;

    transition: .2s;
}

.categorii button:hover {
    background: #e50914;
}


/* =========================
   PLAYER
========================= */

#player {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 99999;

    background:
        radial-gradient(
            circle at center,
            #202020,
            #050505 70%
        );

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.player-box {
    position: relative;

    width: 95%;
    max-width: 1200px;

    background: #111;

    border-radius: 14px;

    padding: 12px;

    box-shadow:
        0 0 50px rgba(0,0,0,.8);
}

.player-title {
    padding: 8px 5px 12px;
}

.player-title h2 {
    font-size: 20px;
}

#movieFrame {
    width: 100%;
    height: 650px;

    display: block;

    border: none;
    border-radius: 8px;

    background: black;
}

.close {
    position: absolute;

    top: -55px;
    right: 0;

    width: 45px;
    height: 45px;

    border: none;
    border-radius: 50%;

    background: #e50914;
    color: white;

    font-size: 24px;

    cursor: pointer;

    transition: .2s;
}

.close:hover {
    background: #ff1f2d;
    transform: rotate(90deg);
}

.back-button {
    margin-top: 12px;

    padding: 10px 18px;

    border: none;
    border-radius: 7px;

    background: #252525;
    color: white;

    cursor: pointer;

    font-weight: bold;
}

.back-button:hover {
    background: #e50914;
}


/* =========================
   TELEFON
========================= */

@media (max-width: 900px) {

    .filme-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    #movieFrame {
        height: 500px;
    }
}

@media (max-width: 550px) {

    .header {
        flex-direction: column;
        gap: 12px;
        padding: 15px;
    }

    .logo {
        font-size: 21px;
    }

    .menu {
        flex-wrap: wrap;
        justify-content: center;
    }

    .menu button {
        padding: 8px 10px;
        font-size: 13px;
    }

    .hero {
        min-height: 500px;
        padding: 35px 20px;
    }

    .hero h1 {
        font-size: 32px;
    }

    .filme-grid {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .player-box {
        width: 100%;
        padding: 7px;
    }

    #movieFrame {
        height: 65vh;
        min-height: 300px;
    }

    .close {
        top: -50px;
        width: 40px;
        height: 40px;
        font-size: 20px;
    }
}
</style>
</head>

/* ==================================================
   AFISARE CARD
================================================== */

function creeazaCard(item) {

    const card =
        document.createElement("div");

    card.className = "card";

    let tipText = "🎬 Film";

    if (item.tip === "desen") {
        tipText = "🧸 Desen";
    }

    if (item.tip === "anime") {
        tipText = "🇯🇵 Anime";
    }

    card.innerHTML = `

        <img
            src="${item.imagine}"
            alt="${item.nume}"
            onerror="this.style.display='none'"
        >

        <div class="tip">
            ${tipText}
        </div>

        <h3>
            ${item.nume}
        </h3>

        <p>
            ${item.gen} • ${item.an}
        </p>

        <button
            onclick="openMovie(${item.id})">

            ▶ Vizionează

        </button>

    `;

    return card;
}


/* ==================================================
   AFISEAZA CONTINUT
================================================== */

function afiseazaContinut(
    tip,
    categorie = "Toate"
) {

    let gridId = "";

    if (tip === "film") {
        gridId = "filmeGrid";
    }

    if (tip === "desen") {
        gridId = "deseneGrid";
    }

    if (tip === "anime") {
        gridId = "animeGrid";
    }

    const grid =
        document.getElementById(gridId);

    if (!grid) return;

    grid.innerHTML = "";

    const lista =
        continut.filter(function(item) {

            return (
                item.tip === tip &&
                (
                    categorie === "Toate" ||
                    item.categorie === categorie
                )
            );

        });

    lista.forEach(function(item) {

        grid.appendChild(
            creeazaCard(item)
        );

    });

}


/* ==================================================
   FILTRE
================================================== */

const categorii = [
    "Toate",
    "Actiune",
    "Aventura",
    "Comedie",
    "Horror",
    "Romantic",
    "SF",
    "Drama",
    "Crime"
];


function creeazaFiltre(
    tip,
    elementId
) {

    const container =
        document.getElementById(
            elementId
        );

    if (!container) return;

    container.innerHTML = "";

    categorii.forEach(function(categorie, index) {

        const button =
            document.createElement("button");

        button.className = "filtru";

        if (index === 0) {
            button.classList.add("activ");
        }

        button.textContent =
            categorie === "Toate"
                ? "Toate"
                : categorie;

        button.onclick =
            function() {

                container
                    .querySelectorAll(".filtru")
                    .forEach(function(btn) {

                        btn.classList.remove(
                            "activ"
                        );

                    });

                button.classList.add("activ");

                afiseazaContinut(
                    tip,
                    categorie
                );

            };

        container.appendChild(button);

    });

}


/* ==================================================
   INITIALIZARE
================================================== */

creeazaFiltre(
    "film",
    "filtreFilme"
);

creeazaFiltre(
    "desen",
    "filtreDesene"
);

creeazaFiltre(
    "anime",
    "filtreAnime"
);


afiseazaContinut("film");
afiseazaContinut("desen");
afiseazaContinut("anime");


/* ==================================================
   SCHIMBA PAGINA
================================================== */

function showPage(pageId) {

    const pages =
        document.querySelectorAll(
            ".sectiune"
        );

    pages.forEach(function(page) {

        page.classList.remove(
            "activa"
        );

    });


    const selected =
        document.getElementById(
            pageId
        );

    if (selected) {

        selected.classList.add(
            "activa"
        );

    }


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==================================================
   CATEGORIE DIN PAGINA CATEGORII
================================================== */

function filtreazaCategorie(categorie) {

    showPage("filme");

    const buttons =
        document.querySelectorAll(
            "#filtreFilme .filtru"
        );

    buttons.forEach(function(button) {

        button.classList.remove(
            "activ"
        );

    });


    afiseazaContinut(
        "film",
        categorie
    );

}


/* ==================================================
   DESCHIDE FILM
================================================== */

function openMovie(id) {

    const item =
        continut.find(function(element) {

            return element.id === id;

        });


    if (!item) {
        return;
    }


    const player =
        document.getElementById(
            "player"
        );

    const frame =
        document.getElementById(
            "movieFrame"
        );

    const title =
        document.getElementById(
            "playerTitle"
        );


    title.textContent =
        "🎬 " + item.nume;


    if (!item.video) {

        frame.src = "";

        alert(
            "Acest titlu nu are încă un link video."
        );

        return;
    }


    frame.src =
        item.video;


    player.style.display =
        "flex";


    document.body.style.overflow =
        "hidden";

}


/* ==================================================
   INCHIDE PLAYER
================================================== */

function closeMovie() {

    const player =
        document.getElementById(
            "player"
        );

    const frame =
        document.getElementById(
            "movieFrame"
        );


    frame.src = "";


    player.style.display =
        "none";


    document.body.style.overflow =
        "auto";

}


/* ==================================================
   ESC
================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeMovie();

        }

    }
);

</script>
